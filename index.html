<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Mapper V40 - Single Video 8 Points</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100vw; height: 100vh; overflow: hidden;
      background-color: #0d0d13; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #device-switcher {
      position: absolute; top: 12px; left: 12px; z-index: 20;
      display: flex; gap: 8px; align-items: center;
      background: rgba(15, 15, 25, 0.85); padding: 8px 12px;
      border-radius: 8px; border: 1px solid rgba(0, 255, 204, 0.3);
      backdrop-filter: blur(8px);
    }
    .mode-btn {
      background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 10px; font-size: 11px; font-weight: bold; border-radius: 6px; cursor: pointer;
    }
    .mode-btn:hover { background: rgba(0, 255, 204, 0.3); border-color: #00ffcc; color: #00ffcc; }
    #res-indicator { font-size: 11px; font-weight: bold; color: #00ffcc; margin-left: 8px; }

    #app-container {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    canvas {
      display: block; background: #000;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      cursor: crosshair;
    }

    #controls {
      position: absolute; top: 60px; left: 12px; z-index: 20;
      width: 280px; background: rgba(15, 15, 25, 0.9);
      padding: 15px; border-radius: 10px; border: 1px solid rgba(0, 255, 204, 0.3);
      backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 8px;
    }
    #controls.hidden { display: none !important; }
    #controls h3 { font-size: 14px; color: #00ffcc; margin-bottom: 5px; text-transform: uppercase; }
    #controls label { font-size: 10px; font-weight: bold; color: #aaa; text-transform: uppercase; margin-top: 4px; }

    .btn {
      background: rgba(255, 255, 255, 0.08); color: #ccc;
      border: 1px solid rgba(255, 255, 255, 0.15); padding: 8px;
      font-size: 11px; border-radius: 6px; cursor: pointer; width: 100%;
    }
    .btn:hover { border-color: #00ffcc; color: #fff; }

    #bottom-bar {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 20; display: flex; gap: 10px;
      background: rgba(15, 15, 25, 0.85); padding: 8px 16px;
      border-radius: 20px; border: 1px solid rgba(0, 255, 204, 0.3);
      backdrop-filter: blur(8px);
    }
    .b-btn {
      background: transparent; color: #00ffcc; border: 1px solid #00ffcc;
      padding: 6px 12px; font-size: 11px; font-weight: bold; border-radius: 12px; cursor: pointer;
    }
    .b-btn:hover { background: rgba(0, 255, 204, 0.2); }
  </style>
</head>
<body>

    <div id="device-switcher">
        <button onclick="setView('desktop')" class="mode-btn">💻 DESKTOP</button>
        <button onclick="setView('mobile')" class="mode-btn">📱 SMARTPHONE</button>
        <div id="res-indicator">MOD: DESKTOP</div>
    </div>

    <div id="app-container">
        <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
        <h3>Studio Mapper V40 - 8 Puncte Unic</h3>
        <label>DECOR FUNDAL:</label>
        <input type="file" id="bgInput" accept="image/*,video/*" class="btn">
        
        <label>FIȘIER VIDEO (PE CADRUL CU 8 PUNCTE):</label>
        <input type="file" id="video1Input" accept="video/*,image/*" class="btn">
        
        <button class="btn" onclick="resetPoints()" style="margin-top:15px; border-color:#ff0055; color:#ff3366; font-weight:bold;">RESETARE CADRU 8 PUNCTE</button>
    </div>

    <div id="bottom-bar">
        <button class="b-btn" onclick="toggleDots()">DOTS: ON/OFF</button>
        <button class="b-btn" onclick="toggleUI()">MENU: ON/OFF</button>
        <button class="b-btn" onclick="toggleFullScreen()">FULL SCREEN</button>
    </div>

    <video id="vid1" loop muted playsinline crossorigin="anonymous" style="display:none"></video>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const v1 = document.getElementById('vid1');

let backgroundImg = new Image();
let showUI = true;
let showDots = true;
let currentMode = 'desktop';

// Structură UNICĂ cu EXACT 8 PUNCTE DE CONTROL pentru tot videoclipul
// Punctele sunt dispuse în grilă 3x3 (fără centru):
// 0: Sus-Stânga,   1: Sus-Mijloc,   2: Sus-Dreapta
// 3: Mijloc-Stânga,                 4: Mijloc-Dreapta
// 5: Jos-Stânga,    6: Jos-Mijloc,   7: Jos-Dreapta
let singleLayer = {
  pts: [
    {x: 100, y: 100}, {x: 300, y: 100}, {x: 500, y: 100},
    {x: 100, y: 300},                   {x: 500, y: 300},
    {x: 100, y: 500}, {x: 300, y: 500}, {x: 500, y: 500}
  ]
};

// Restaurare puncte salvate anterior
const saved = localStorage.getItem('v40_single_8pts');
if (saved) {
  try {
    const parsed = JSON.parse(saved);
    if (parsed && parsed.length === 8) {
      singleLayer.pts = parsed;
    }
  } catch(e) {}
}

function setView(type) {
    currentMode = type;
    const resText = document.getElementById('res-indicator');
    if (type === 'mobile') {
        canvas.width = 390; canvas.height = 844;
        canvas.style.width = '390px'; canvas.style.height = '844px';
        resText.innerText = "MOD: SMARTPHONE (390x844)";
    } else {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        canvas.style.width = '100%'; canvas.style.height = '100%';
        resText.innerText = "MOD: DESKTOP (FULL)";
    }
}

function setupEvents() {
    window.onresize = () => { if(currentMode === 'desktop') setView('desktop'); };
    
    document.getElementById('bgInput').onchange = (e) => { 
        if(e.target.files[0]) backgroundImg.src = URL.createObjectURL(e.target.files[0]); 
    };

    document.getElementById('video1Input').onchange = (e) => { 
        if(e.target.files[0]) { 
            v1.src = URL.createObjectURL(e.target.files[0]); 
            v1.play(); 
        }
    };

    let dragPt = null;
    let dragLayer = false;
    let lastMouse = {x:0, y:0};

    canvas.onmousedown = (e) => {
        if(!showDots) return;
        const rect = canvas.getBoundingClientRect();
        const mouse = { 
            x: (e.clientX - rect.left) * (canvas.width / rect.width), 
            y: (e.clientY - rect.top) * (canvas.height / rect.height) 
        };

        dragPt = null;
        dragLayer = false;

        // Verificăm dacă s-a dat click pe unul din cele 8 puncte
        singleLayer.pts.forEach(p => { 
            if(Math.hypot(p.x - mouse.x, p.y - mouse.y) < 30) dragPt = p; 
        });

        // Dacă nu s-a atins niciun punct, permitem mutarea întregului cadru
        if(!dragPt) {
            const minX = Math.min(...singleLayer.pts.map(p => p.x));
            const maxX = Math.max(...singleLayer.pts.map(p => p.x));
            const minY = Math.min(...singleLayer.pts.map(p => p.y));
            const maxY = Math.max(...singleLayer.pts.map(p => p.y));

            if(mouse.x > minX && mouse.x < maxX && mouse.y > minY && mouse.y < maxY) {
                dragLayer = true;
            }
        }
        lastMouse = mouse;
    };

    window.onmousemove = (e) => {
        if(!dragPt && !dragLayer) return;
        const rect = canvas.getBoundingClientRect();
        const mouse = { 
            x: (e.clientX - rect.left) * (canvas.width / rect.width), 
            y: (e.clientY - rect.top) * (canvas.height / rect.height) 
        };
        const dx = mouse.x - lastMouse.x;
        const dy = mouse.y - lastMouse.y;

        if(dragPt) { 
            dragPt.x = mouse.x; 
            dragPt.y = mouse.y; 
        } else if(dragLayer) { 
            singleLayer.pts.forEach(p => { p.x += dx; p.y += dy; }); 
        }

        lastMouse = mouse;
        localStorage.setItem('v40_single_8pts', JSON.stringify(singleLayer.pts));
    };

    window.onmouseup = () => { dragPt = null; dragLayer = false; };
}

// Funcție matematică pentru a desena o bucată din clipul video deformata (pe un triunghi)
function drawSubTexture(media, p0, p1, p2, u0, v0, u1, v1, u2, v2) {
    const w = media.videoWidth || media.width || 1;
    const h = media.videoHeight || media.height || 1;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.closePath();
    ctx.clip();

    const x0 = p0.x, y0 = p0.y, x1 = p1.x, y1 = p1.y, x2 = p2.x, y2 = p2.y;
    const sx0 = u0 * w, sy0 = v0 * h, sx1 = u1 * w, sy1 = v1 * h, sx2 = u2 * w, sy2 = v2 * h;

    const denom = (sx0 * (sy1 - sy2) + sx1 * (sy2 - sy0) + sx2 * (sy0 - sy1));
    if (Math.abs(denom) < 1e-5) { ctx.restore(); return; }

    const a = (x0 * (sy1 - sy2) + x1 * (sy2 - sy0) + x2 * (sy0 - sy1)) / denom;
    const c = (x0 * (sx2 - sx1) + x1 * (sx0 - sx2) + x2 * (sx1 - sx0)) / denom;
    const e = (x0 * (sx1 * sy2 - sx2 * sy1) + x1 * (sx2 * sy0 - sx0 * sy2) + x2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    const b = (y0 * (sy1 - sy2) + y1 * (sy2 - sy0) + y2 * (sy0 - sy1)) / denom;
    const d = (y0 * (sx2 - sx1) + y1 * (sx0 - sx2) + y2 * (sx1 - sx0)) / denom;
    const f = (y0 * (sx1 * sy2 - sx2 * sy1) + y1 * (sx2 * sy0 - sx0 * sy2) + y2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    ctx.transform(a, b, c, d, e, f);
    ctx.drawImage(media, 0, 0, w, h);
    ctx.restore();
}

// Mapează TOT VIDEOCLIPUL pe cele 8 PUNCTE împărțind cadrul în 6 triunghiuri
function render8PointWarp(media, pts) {
    const [p0, p1, p2, p3, p4, p5, p6, p7] = pts;

    // Sector Stânga-Sus
    drawSubTexture(media, p0, p1, p3, 0, 0,  0.5, 0,  0, 0.5);
    drawSubTexture(media, p1, p4, p3, 0.5, 0, 0.5, 0.5, 0, 0.5);

    // Sector Dreapta-Sus
    drawSubTexture(media, p1, p2, p4, 0.5, 0, 1, 0,  0.5, 0.5);
    drawSubTexture(media, p2, p7, p4, 1, 0,   1, 0.5, 0.5, 0.5);

    // Sector Stânga-Jos
    drawSubTexture(media, p3, p4, p5, 0, 0.5, 0.5, 0.5, 0, 1);
    drawSubTexture(media, p4, p6, p5, 0.5, 0.5, 0.5, 1, 0, 1);

    // Sector Dreapta-Jos
    drawSubTexture(media, p4, p7, p6, 0.5, 0.5, 1, 0.5, 0.5, 1);
    drawSubTexture(media, p7, p7, p6, 1, 0.5,   1, 1,   0.5, 1);
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if(backgroundImg.src) {
        ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);
    }
    
    // Mapează videoclipul pe cele 8 puncte ale cadrului unic
    if(v1.readyState >= 2) {
        render8PointWarp(v1, singleLayer.pts);
    }
    
    // Desenează punctele de control pe ecran
    if(showDots) {
        // Linii de ghidaj între puncte
        ctx.strokeStyle = 'rgba(0, 255, 204, 0.4)';
        ctx.lineWidth = 1.5;
        const p = singleLayer.pts;
        
        ctx.beginPath();
        // Contur exterior
        ctx.moveTo(p[0].x, p[0].y); ctx.lineTo(p[1].x, p[1].y); ctx.lineTo(p[2].x, p[2].y);
        ctx.lineTo(p[4].x, p[4].y); ctx.lineTo(p[7].x, p[7].y); ctx.lineTo(p[6].x, p[6].y);
        ctx.lineTo(p[5].x, p[5].y); ctx.lineTo(p[3].x, p[3].y); ctx.closePath();
        // Linii interioare
        ctx.moveTo(p[1].x, p[1].y); ctx.lineTo(p[6].x, p[6].y);
        ctx.moveTo(p[3].x, p[3].y); ctx.lineTo(p[4].x, p[4].y);
        ctx.stroke();

        // Cercuri pentru cele 8 puncte de control
        p.forEach((pt, idx) => { 
            ctx.fillStyle = (idx === 1 || idx === 6 || idx === 3 || idx === 4) ? '#ff0055' : '#00ffff'; 
            ctx.beginPath(); 
            ctx.arc(pt.x, pt.y, 8, 0, Math.PI*2); 
            ctx.fill(); 
            ctx.strokeStyle = '#fff';
            ctx.stroke();
        });
    }
    requestAnimationFrame(animate);
}

function toggleUI() { 
    showUI = !showUI; 
    document.getElementById('controls').classList.toggle('hidden', !showUI); 
}

function toggleDots() { showDots = !showDots; }

function toggleFullScreen() { 
    if(!document.fullscreenElement) document.documentElement.requestFullscreen(); 
    else document.exitFullscreen(); 
}

function resetPoints() { 
    localStorage.removeItem('v40_single_8pts'); 
    location.reload(); 
}

setupEvents(); 
setView('desktop'); 
animate();
</script>
</body>
</html>
