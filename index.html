<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VTuber Studio v2.5 - Interactive & FX Edition</title>

  <!-- MediaPipe CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    body, html { width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    
    .canvas-container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    canvas { width: 100%; height: 100%; object-fit: cover; }
    #webcam, #bgVideo { display: none; }
    
    /* Overlay Floating Buttons */
    .floating-btn {
      position: absolute; z-index: 100;
      background: rgba(0, 0, 0, 0.65); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; backdrop-filter: blur(4px); transition: transform 0.2s, background 0.2s;
    }
    .floating-btn:hover { transform: scale(1.1); background: rgba(0, 0, 0, 0.85); }
    
    #togglePanelBtn { top: 15px; left: 15px; }
    #quickRecordBtn { top: 15px; left: 68px; background: rgba(230, 57, 70, 0.8); }
    #quickRecordBtn.recording { background: #ff0000; animation: pulse 1s infinite; }
    #fullscreenToggle { top: 15px; right: 15px; border-radius: 8px; width: auto; padding: 0 12px; font-size: 13px; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* VU Meter Vizualizer */
    .vu-container {
      position: absolute; bottom: 15px; right: 15px; z-index: 100;
      display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.6);
      padding: 6px 10px; border-radius: 20px; border: 1px solid #333; backdrop-filter: blur(4px);
    }
    .vu-bar-bg { width: 80px; height: 10px; background: #222; border-radius: 5px; overflow: hidden; border: 1px solid #444; }
    .vu-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #2a9d8f, #e9c46a, #e63946); transition: width 0.05s ease; }

    /* Panou Controale */
    .controls-panel { 
      position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); 
      background: rgba(18, 18, 18, 0.92); padding: 14px; border-radius: 14px; 
      display: flex; flex-direction: column; gap: 10px; max-width: 95%; max-height: 55vh; 
      overflow-y: auto; z-index: 90; width: 460px; border: 1px solid #333;
      transition: opacity 0.3s ease, transform 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .controls-panel.hidden { opacity: 0; pointer-events: none; transform: translate(-50%, 25px); }
    
    .btn-group { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .btn { padding: 8px 10px; border: none; border-radius: 6px; background: #2a2a2a; color: white; cursor: pointer; font-size: 12px; }
    .btn:hover { background: #3d3d3d; }
    .btn-active { background: #2a9d8f !important; font-weight: bold; }
    
    .upload-section { display: flex; gap: 6px; }
    .file-input { display: none; }
    .btn-upload { background: #2a9d8f; flex: 1; text-align: center; }
    
    .gallery-container { display: flex; flex-direction: column; gap: 4px; }
    .gallery-label { font-size: 11px; color: #aaa; margin-top: 4px; }
    .gallery { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
    .gallery-item { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; border: 2px solid #444; cursor: pointer; flex-shrink: 0; }

    .slider-group { display: flex; flex-direction: column; gap: 5px; font-size: 11px; }
    .slider-row { display: flex; justify-content: space-between; align-items: center; }
    .slider-row input { width: 55%; }

    #status { position: absolute; top: 15px; left: 120px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 11px; z-index: 80; color: #888; }
  </style>
</head>
<body>

  <div id="status">Pornire VTuber Studio...</div>
  
  <!-- Butoane Rapide -->
  <button id="togglePanelBtn" class="floating-btn" title="Meniu">👁</button>
  <button id="quickRecordBtn" class="floating-btn" title="Înregistrare MP4">⏺</button>
  <button id="fullscreenToggle" class="floating-btn">🔲 Fullscreen</button>

  <!-- VU Meter Widget -->
  <div class="vu-container">
    <button id="toggleVuBtn" class="btn" style="padding: 2px 6px; font-size: 10px;">🎤 Mic: ON</button>
    <div class="vu-bar-bg"><div id="vuFill" class="vu-bar-fill"></div></div>
  </div>

  <div class="canvas-container" id="canvasContainer">
    <video id="webcam" playsinline muted></video>
    <video id="bgVideo" loop muted playsinline></video>
    <canvas id="mainCanvas"></canvas>
  </div>

  <div class="controls-panel" id="controlsPanel">
    <!-- Comutatoare Cam/AI/Mască -->
    <div class="btn-group">
      <button id="toggleShowCam" class="btn">Camera Reală: OFF</button>
      <button id="toggleAiCut" class="btn">AI Cut-Off Corp: OFF</button>
      <button id="toggleMaskOnly" class="btn">Doar Mască VTuber: ON</button>
      <button id="toggleFlipH" class="btn">Oglindire Orizontală</button>
      <button id="toggleFlipV" class="btn">Oglindire Verticală</button>
    </div>

    <!-- Efecte Speciale Overlay -->
    <div class="gallery-label">Efecte Speciale Vizuale:</div>
    <div class="btn-group">
      <button id="toggleHearts" class="btn">💖 Inimioare: OFF</button>
      <button id="toggleSmoke" class="btn">💨 Fum RGB: OFF</button>
      <button id="toggleSparks" class="btn">✨ Scântei: OFF</button>
    </div>

    <!-- Upload Resurse -->
    <div class="upload-section">
      <label class="btn btn-upload">
        🖼 Upload Fundal (Foto/Video)
        <input type="file" id="bgUploader" class="file-input" accept="image/*,video/*">
      </label>
      <label class="btn btn-upload">
        🎭 Upload Față PNG
        <input type="file" id="avatarUploader" class="file-input" accept="image/*">
      </label>
    </div>

    <!-- Galerii Salvate LocalStorage -->
    <div class="gallery-container">
      <div class="gallery-label">Fundaluri Salvate:</div>
      <div class="gallery" id="bgGallery"></div>
      <div class="gallery-label">Avatare Salvate:</div>
      <div class="gallery" id="avatarGallery"></div>
    </div>

    <!-- Sliders Ajustare Avatar Față -->
    <div class="slider-group">
      <div class="slider-row"><label>Lățime Față:</label><input type="range" id="scaleWidthSlider" min="0.1" max="3" step="0.05" value="1"></div>
      <div class="slider-row"><label>Înălțime Față:</label><input type="range" id="scaleHeightSlider" min="0.1" max="3" step="0.05" value="1"></div>
      <div class="slider-row"><label>Rotație Față:</label><input type="range" id="rotationSlider" min="-180" max="180" step="1" value="0"></div>
      <div class="slider-row"><label>Offset X Față:</label><input type="range" id="offsetXSlider" min="-500" max="500" step="1" value="0"></div>
      <div class="slider-row"><label>Offset Y Față:</label><input type="range" id="offsetYSlider" min="-500" max="500" step="1" value="0"></div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const bgVideoElement = document.getElementById('bgVideo');
    const canvasElement = document.getElementById('mainCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusEl = document.getElementById('status');
    
    const controlsPanel = document.getElementById('controlsPanel');
    const togglePanelBtn = document.getElementById('togglePanelBtn');
    const quickRecordBtn = document.getElementById('quickRecordBtn');
    const fullscreenToggle = document.getElementById('fullscreenToggle');

    const vuFill = document.getElementById('vuFill');
    const toggleVuBtn = document.getElementById('toggleVuBtn');

    // UI Buttons & Sliders
    const toggleShowCam = document.getElementById('toggleShowCam');
    const toggleAiCut = document.getElementById('toggleAiCut');
    const toggleMaskOnly = document.getElementById('toggleMaskOnly');
    const toggleFlipH = document.getElementById('toggleFlipH');
    const toggleFlipV = document.getElementById('toggleFlipV');

    const toggleHearts = document.getElementById('toggleHearts');
    const toggleSmoke = document.getElementById('toggleSmoke');
    const toggleSparks = document.getElementById('toggleSparks');

    const bgUploader = document.getElementById('bgUploader');
    const avatarUploader = document.getElementById('avatarUploader');
    const bgGallery = document.getElementById('bgGallery');
    const avatarGallery = document.getElementById('avatarGallery');

    const scaleWidthSlider = document.getElementById('scaleWidthSlider');
    const scaleHeightSlider = document.getElementById('scaleHeightSlider');
    const rotationSlider = document.getElementById('rotationSlider');
    const offsetXSlider = document.getElementById('offsetXSlider');
    const offsetYSlider = document.getElementById('offsetYSlider');

    // Stări
    let showRealCam = false;
    let isAiCutOn = false;
    let isMaskOnly = true;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let flipH = false;
    let flipV = false;

    let fxHearts = false;
    let fxSmoke = false;
    let fxSparks = false;
    let micActive = true;

    let activeBgType = null;
    let activeBgImg = null;
    let activeAvatarImg = null;

    let savedBgs = JSON.parse(localStorage.getItem('vtuber_bgs_v25') || '[]');
    let savedAvatars = JSON.parse(localStorage.getItem('vtuber_avatars_v25') || '[]');

    const sliders = [scaleWidthSlider, scaleHeightSlider, rotationSlider, offsetXSlider, offsetYSlider];

    // Salvare / Încărcare
    function saveState() {
      const state = {
        flipH, flipV, showRealCam, isAiCutOn, isMaskOnly, fxHearts, fxSmoke, fxSparks
      };
      sliders.forEach(s => state[s.id] = s.value);
      localStorage.setItem('vtuber_app_state_v25', JSON.stringify(state));
    }

    function loadState() {
      const saved = JSON.parse(localStorage.getItem('vtuber_app_state_v25') || '{}');
      flipH = saved.flipH || false;
      flipV = saved.flipV || false;
      showRealCam = saved.showRealCam || false;
      isAiCutOn = saved.isAiCutOn || false;
      isMaskOnly = saved.isMaskOnly !== undefined ? saved.isMaskOnly : true;
      fxHearts = saved.fxHearts || false;
      fxSmoke = saved.fxSmoke || false;
      fxSparks = saved.fxSparks || false;

      sliders.forEach(s => { if (saved[s.id] !== undefined) s.value = saved[s.id]; });
      updateUIState();
    }

    function updateUIState() {
      toggleShowCam.innerText = `Camera Reală: ${showRealCam ? 'ON' : 'OFF'}`;
      toggleAiCut.innerText = `AI Cut-Off Corp: ${isAiCutOn ? 'ON' : 'OFF'}`;
      toggleMaskOnly.innerText = `Doar Mască VTuber: ${isMaskOnly ? 'ON' : 'OFF'}`;
      
      toggleHearts.innerText = `💖 Inimioare: ${fxHearts ? 'ON' : 'OFF'}`;
      toggleSmoke.innerText = `💨 Fum RGB: ${fxSmoke ? 'ON' : 'OFF'}`;
      toggleSparks.innerText = `✨ Scântei: ${fxSparks ? 'ON' : 'OFF'}`;

      toggleHearts.classList.toggle('btn-active', fxHearts);
      toggleSmoke.classList.toggle('btn-active', fxSmoke);
      toggleSparks.classList.toggle('btn-active', fxSparks);
    }

    sliders.forEach(s => s.addEventListener('input', saveState));

    togglePanelBtn.addEventListener('click', () => controlsPanel.classList.toggle('hidden'));
    fullscreenToggle.addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err));
      else if (document.exitFullscreen) document.exitFullscreen();
    });

    toggleShowCam.addEventListener('click', () => { showRealCam = !showRealCam; updateUIState(); saveState(); });
    toggleAiCut.addEventListener('click', () => { isAiCutOn = !isAiCutOn; updateUIState(); saveState(); });
    toggleMaskOnly.addEventListener('click', () => { isMaskOnly = !isMaskOnly; updateUIState(); saveState(); });
    toggleFlipH.addEventListener('click', () => { flipH = !flipH; saveState(); });
