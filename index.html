<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D & 3D Rigging - Free Mesh Torso & Interactive Head</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background-color: #08080c;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #container { position: relative; width: 100vw; height: 100vh; }
    #webcam, #output_canvas, #bg-video {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh; object-fit: cover;
    }
    #webcam, #bg-video { display: none; }
    #output_canvas { z-index: 2; transform: scaleX(-1); cursor: crosshair; }

    #ui-toggle-btn {
      position: absolute; top: 15px; right: 15px; z-index: 100;
      background: rgba(0, 255, 204, 0.2); border: 1px solid #00ffcc;
      color: #00ffcc; padding: 8px 14px; font-size: 12px; font-weight: bold;
      border-radius: 8px; cursor: pointer; backdrop-filter: blur(5px);
    }
    #ui-toggle-btn:hover { background: rgba(0, 255, 204, 0.4); }

    #ui-overlay {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      display: flex; flex-direction: column; gap: 10px; width: 380px;
      max-height: 92vh; overflow-y: auto;
      background: rgba(15, 15, 25, 0.92); padding: 15px; border-radius: 12px;
      border: 1px solid rgba(0, 255, 204, 0.3); backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      transition: opacity 0.3s ease;
    }
    #ui-overlay.hidden { display: none !important; }

    .btn-main {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000; border: none; padding: 12px 16px; font-size: 14px;
      font-weight: bold; border-radius: 8px; cursor: pointer;
    }
    .btn-main:hover { transform: scale(1.02); }

    .btn-toggle {
      background: rgba(255, 255, 255, 0.1); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2); padding: 5px 8px;
      font-size: 11px; border-radius: 6px; cursor: pointer; min-width: 65px;
      text-align: center;
    }
    .btn-toggle.active {
      background: rgba(0, 255, 204, 0.3); border-color: #00ffcc; color: #00ffcc; font-weight: bold;
    }

    .upload-group {
      display: flex; flex-direction: column; gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 10px;
    }
    .upload-group label { color: #00ffcc; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    .file-input { color: #ccc; font-size: 11px; flex: 1; }
    .row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .item-row { display: flex; align-items: center; gap: 8px; }
    .scale-controls { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 11px; }
    .scale-controls input[type="range"] { flex: 1; }
    #status { color: #00ffcc; font-size: 12px; font-weight: bold; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="container">
  <button id="ui-toggle-btn">👁️ Hide Controls</button>

  <div id="ui-overlay">
    <button id="start-btn" class="btn-main">▶ Pornire Camera & Rigging</button>
    <div id="status">Apasă pe buton pentru start...</div>

    <div class="upload-group">
      <label>Comutatoare Generale</label>
      <div class="row-btns">
        <button id="toggle-skeleton" class="btn-toggle active">Linii Grid: ON</button>
        <button id="toggle-crop" class="btn-toggle active">Crop AI: ON</button>
        <button id="toggle-hide-cam" class="btn-toggle">Camera: SHOW</button>
        <button id="reset-offsets" class="btn-toggle" style="border-color:#ff0055; color:#ff3366;">Reset Formă Puncte</button>
      </div>
    </div>

    <div class="upload-group">
      <label>Încărcare Măști & Segmente (Foto / Video)</label>
      
      <div class="item-row">
        <button id="tog-head" class="btn-toggle active">Cap: ON</button>
        <input type="file" id="file-head" accept="image/*,video/*" class="file-input">
      </div>

      <div class="item-row">
        <button id="tog-torso" class="btn-toggle active">Torso Mesh: ON</button>
        <input type="file" id="file-torso" accept="image/*,video/*" class="file-input">
      </div>

      <div class="item-row">
        <button id="tog-arm-left" class="btn-toggle active">Braț L: ON</button>
        <input type="file" id="file-arm-left" accept="image/*,video/*" class="file-input">
      </div>

      <div class="item-row">
        <button id="tog-arm-right" class="btn-toggle active">Braț R: ON</button>
        <input type="file" id="file-arm-right" accept="image/*,video/*" class="file-input">
      </div>
    </div>

    <div class="upload-group">
      <label>Model 3D Separabil (GLB / GLTF)</label>
      <div class="item-row">
        <button id="tog-3d" class="btn-toggle active">Model 3D: ON</button>
        <input type="file" id="file-3d" accept=".glb,.gltf" class="file-input">
      </div>
      <div class="scale-controls">
        <span>Scală 3D:</span>
        <input type="range" id="scale-3d" min="0.1" max="3.0" step="0.05" value="1.0">
      </div>
      <div class="scale-controls">
        <span>Offset X 3D:</span>
        <input type="range" id="offset-3d-x" min="-300" max="300" step="2" value="0">
      </div>
      <div class="scale-controls">
        <span>Offset Y 3D:</span>
        <input type="range" id="offset-3d-y" min="-300" max="300" step="2" value="0">
      </div>
    </div>

    <div class="upload-group">
      <label>Calibrare Manuală Cap & Brațe</label>
      <div class="scale-controls">
        <span>Scală Cap:</span>
        <input type="range" id="scale-head" min="0.3" max="4.0" step="0.05" value="1.0">
      </div>
      <div class="scale-controls">
        <span>Grosime Brațe:</span>
        <input type="range" id="scale-arms" min="0.5" max="3.0" step="0.1" value="1.0">
      </div>
    </div>

    <div class="upload-group">
      <label>Fundal Custom (Foto / Video)</label>
      <div class="item-row">
        <button id="tog-bg" class="btn-toggle active">Fundal: ON</button>
        <input type="file" id="bg-file-upload" accept="image/*,video/*" class="file-input">
      </div>
    </div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <video id="bg-video" autoplay loop muted playsinline></video>
  <canvas id="output_canvas"></canvas>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const bgVideoElement = document.getElementById('bg-video');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');

  const startBtn = document.getElementById('start-btn');
  const statusDiv = document.getElementById('status');
  const resetBtn = document.getElementById('reset-offsets');

  const uiOverlay = document.getElementById('ui-overlay');
  const uiToggleBtn = document.getElementById('ui-toggle-btn');
  let isUiVisible = true;

  uiToggleBtn.addEventListener('click', () => {
    isUiVisible = !isUiVisible;
    uiOverlay.classList.toggle('hidden', !isUiVisible);
    uiToggleBtn.innerText = isUiVisible ? "👁️ Hide Controls" : "👁️ Show Controls";
  });

  const toggleSkeletonBtn = document.getElementById('toggle-skeleton');

  const toggleHideCamBtn = document.getElementById('toggle-hide-cam');
  const tog3DBtn = document.getElementById('tog-3d');

  const togHeadBtn = document.getElementById('tog-head');
  const togTorsoBtn = document.getElementById('tog-torso');
  const togArmLeftBtn = document.getElementById('tog-arm-left');
  const togArmRightBtn = document.getElementById('tog-arm-right');
  const togBgBtn = document.getElementById('tog-bg');

  const input3D = document.getElementById('file-3d');
  const bgFileUpload = document.getElementById('bg-file-upload');

  const sliderHead = document.getElementById('scale-head');
  const sliderArms = document.getElementById('scale-arms');
  const slider3DScale = document.getElementById('scale-3d');
  const slider3DX = document.getElementById('offset-3d-x');
  const slider3DY = document.getElementById('offset-3d-y');

  let show3D = localStorage.getItem('app_vis_3d') !== 'false';
  let showBg = localStorage.getItem('app_vis_bg') !== 'false';

  const partVis = {
    head: localStorage.getItem('app_vis_head') !== 'false',
    torso: localStorage.getItem('app_vis_torso') !== 'false',
    armLeft: localStorage.getItem('app_vis_armLeft') !== 'false',
    armRight: localStorage.getItem('app_vis_armRight') !== 'false'
  };

  let torsoGridOffsets = JSON.parse(localStorage.getItem('app_torso_grid_offsets')) || [
    {x:0, y:0}, {x:0, y:0}, {x:0, y:0}, {x:0, y:0},
    {x:0, y:0}, {x:0, y:0}, {x:0, y:0}, {x:0, y:0}
  ];

  let headOffset = JSON.parse(localStorage.getItem('app_head_drag_offset')) || { x: 0, y: 0 };

  let bgType = 'none';
  let customBgImg = null;

  const segmentAssets = {
    head: { type: null, element: null },
    torso: { type: null, element: null },
    armLeft: { type: null, element: null },
    armRight: { type: null, element: null }
  };
