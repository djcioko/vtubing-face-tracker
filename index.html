<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torso Mapper - 4 Puncte Drag&Drop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100vw; height: 100vh; overflow: hidden;
      background-color: #08080c; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #app-container {
      width: 100vw; height: 100vh; position: relative;
    }

    canvas {
      display: block; width: 100vw; height: 100vh;
      background: #000; cursor: crosshair;
    }

    #upload-container {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(15, 15, 25, 0.85); padding: 10px 14px;
      border-radius: 8px; border: 1px solid rgba(0, 255, 204, 0.3);
      backdrop-filter: blur(8px); display: flex; align-items: center; gap: 10px;
    }

    #upload-container label {
      font-size: 11px; font-weight: bold; color: #00ffcc; text-transform: uppercase;
    }

    .file-btn {
      color: #ccc; font-size: 11px;
    }

    #reset-btn {
      background: transparent; color: #ff3366; border: 1px solid #ff3366;
      padding: 4px 8px; font-size: 10px; border-radius: 4px; cursor: pointer;
    }
    #reset-btn:hover { background: rgba(255, 51, 102, 0.2); }
  </style>
</head>
<body>

<div id="app-container">
  <div id="upload-container">
    <label>Incarca Video Torso:</label>
    <input type="file" id="videoInput" accept="video/*,image/*" class="file-btn">
    <button id="reset-btn">Resetare Poziție</button>
  </div>

  <canvas id="canvas"></canvas>
</div>

<video id="vid" loop muted playsinline crossorigin="anonymous" style="display:none"></video>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const videoElem = document.getElementById('vid');
  const videoInput = document.getElementById('videoInput');
  const resetBtn = document.getElementById('reset-btn');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // STRICT 4 COLȚURI (Sus-Stânga, Sus-Dreapta, Jos-Dreapta, Jos-Stânga)
  let defaultPts = [
    { x: canvas.width * 0.35, y: canvas.height * 0.2 }, // 0: Top-Left
    { x: canvas.width * 0.65, y: canvas.height * 0.2 }, // 1: Top-Right
    { x: canvas.width * 0.65, y: canvas.height * 0.8 }, // 2: Bottom-Right
    { x: canvas.width * 0.35, y: canvas.height * 0.8 }  // 3: Bottom-Left
  ];

  let pts = JSON.parse(localStorage.getItem('app_torso_4pts')) || defaultPts;

  function savePoints() {
    localStorage.setItem('app_torso_4pts', JSON.stringify(pts));
  }

  resetBtn.addEventListener('click', () => {
    pts = [
      { x: canvas.width * 0.35, y: canvas.height * 0.2 },
      { x: canvas.width * 0.65, y: canvas.height * 0.2 },
      { x: canvas.width * 0.65, y: canvas.height * 0.8 },
      { x: canvas.width * 0.35, y: canvas.height * 0.8 }
    ];
    savePoints();
  });

  videoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      videoElem.src = URL.createObjectURL(file);
      videoElem.play();
    }
  });

  let dragPtIndex = -1;
  let isDraggingWholeFrame = false;
  let lastMousePos = { x: 0, y: 0 };

  function isPointInsidePolygon(point, vs) {
    let x = point.x, y = point.y;
    let inside = false;
    for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
      let xi = vs[i].x, yi = vs[i].y;
      let xj = vs[j].x, yj = vs[j].y;
      let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  canvas.addEventListener('mousedown', (e) => {
    const mouse = getMousePos(e);
    dragPtIndex = -1;
    isDraggingWholeFrame = false;

    // Verifică dacă ai dat click pe unul din cele 4 colțuri
    for (let i = 0; i < pts.length; i++) {
      if (Math.hypot(pts[i].x - mouse.x, pts[i].y - mouse.y) < 25) {
        dragPtIndex = i;
        break;
      }
    }

    // Dacă nu s-a atins niciun colț, dar s-a dat click în interiorul cadrului -> mută tot cadrul
    if (dragPtIndex === -1 && isPointInsidePolygon(mouse, pts)) {
      isDraggingWholeFrame = true;
    }

    lastMousePos = mouse;
  });

  window.addEventListener('mousemove', (e) => {
    if (dragPtIndex === -1 && !isDraggingWholeFrame) return;

    const mouse = getMousePos(e);
    const dx = mouse.x - lastMousePos.x;
    const dy = mouse.y - lastMousePos.y;

    if (dragPtIndex !== -1) {
      // Modifică un singur colț
      pts[dragPtIndex].x = mouse.x;
      pts[dragPtIndex].y = mouse.y;
    } else if (isDraggingWholeFrame) {
      // Mută tot cadrul sus/jos/stânga/dreapta
      pts.forEach(p => {
        p.x += dx;
        p.y += dy;
      });
    }

    lastMousePos = mouse;
    savePoints();
  });

  window.addEventListener('mouseup', () => {
    dragPtIndex = -1;
    isDraggingWholeFrame = false;
  });

  // Randare imagine deformată liber pe cele 4 colțuri (2 triunghiuri)
  function drawTriangleSubTexture(media, p0, p1, p2, u0, v0, u1, v1, u2, v2) {
    const w = media.videoWidth || media.width || 1;
    const h = media.videoHeight || media.height || 1;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.closePath();
    ctx.clip();

    const x0 = p0.x, y0 = p0.y, x1 = p1.x, y1 = p1.y, x2 = p2.x, y2 = p2.y;
    const sx0 = u0 * w, sy0 = v0 * h, sx1 = u1 * w, sy1 = v1 * h, sx2 = u2 * w, sy2 = v2 * h;

    const denom = (sx0 * (sy1 - sy2) + sx1 * (sy2 - sy0) + sx2 * (sy0 - sy1));
    if (Math.abs(denom) < 1e-5) { ctx.restore(); return; }

    const a = (x0 * (sy1 - sy2) + x1 * (sy2 - sy0) + x2 * (sy0 - sy1)) / denom;
    const c = (x0 * (sx2 - sx1) + x1 * (sx0 - sx2) + x2 * (sx1 - sx0)) / denom;
    const e = (x0 * (sx1 * sy2 - sx2 * sy1) + x1 * (sx2 * sy0 - sx0 * sy2) + x2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    const b = (y0 * (sy1 - sy2) + y1 * (sy2 - sy0) + y2 * (sy0 - sy1)) / denom;
    const d = (y0 * (sx2 - sx1) + y1 * (sx0 - sx2) + y2 * (sx1 - sx0)) / denom;
    const f = (y0 * (sx1 * sy2 - sx2 * sy1) + y1 * (sx2 * sy0 - sx0 * sy2) + y2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    ctx.transform(a, b, c, d, e, f);
    ctx.drawImage(media, 0, 0, w, h);
    ctx.restore();
  }

  function render4PointWarp(media) {
    // Triunghi 1: Sus-Stânga, Sus-Dreapta, Jos-Stânga
    drawTriangleSubTexture(media, pts[0], pts[1], pts[3], 0, 0, 1, 0, 0, 1);
    // Triunghi 2: Sus-Dreapta, Jos-Dreapta, Jos-Stânga
    drawTriangleSubTexture(media, pts[1], pts[2], pts[3], 1, 0, 1, 1, 0, 1);
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Daca videoclipul e incarcat, il randam pe cele 4 puncte
    if (videoElem.readyState >= 2) {
      render4PointWarp(videoElem);
    }

    // Desenează liniile cadrului
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(pts[1].x, pts[1].y);
    ctx.lineTo(pts[2].x, pts[2].y);
    ctx.lineTo(pts[3].x, pts[3].y);
    ctx.closePath();
    ctx.stroke();

    // Desenează doar cele 4 cercuri din colțuri
    pts.forEach((p) => {
      ctx.fillStyle = '#00ffcc';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    });

    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
