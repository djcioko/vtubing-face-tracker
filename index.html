<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VTuber Studio Vertical - Live TikTok & Events</title>
  
  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100%; height: 100%; background: #080b10;
      font-family: 'Segoe UI', Roboto, sans-serif; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      overflow-y: auto; overflow-x: hidden;
    }
    
    /* Containerul Video / Preview Vertical */
    #preview-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 70vh;
      margin-top: 10px;
      background: #000;
      border: 2px solid #00a2ff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 162, 255, 0.3);
    }

    /* Cand se intra in Fullscreen */
    :fullscreen #preview-container, :-webkit-full-screen #preview-container {
      max-width: 100vw;
      width: 100vw;
      height: 100vh;
      margin: 0;
      border: none;
      border-radius: 0;
    }

    canvas {
      width: 100%; height: 100%;
      object-fit: cover; /* Umple tot ecranul fara margini negre */
      display: block;
    }
    video { display: none; }

    /* Control Overlay in Fullscreen */
    #overlay-controls {
      position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
      z-index: 50; display: flex; align-items: center; gap: 10px;
      background: rgba(0,0,0,0.75); padding: 8px 16px; border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px);
    }

    /* Panou Control Sub Video (Stilul Clasic) */
    #main-panel {
      width: 100%; max-width: 500px; padding: 15px;
      display: flex; flex-direction: column; gap: 12px;
      margin-bottom: 40px;
    }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn-action {
      background: #0078d4; color: white; border: 1px solid #005a9e;
      padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;
      text-align: center; font-size: 13px; transition: 0.2s;
    }
    .btn-action.active { background: #00a2ff; border-color: #66c2ff; box-shadow: 0 0 10px rgba(0,162,255,0.5); }
    .btn-green { background: #00b894; border-color: #00cec9; }
    .btn-green:hover { background: #00bec9; }

    .section-title {
      font-size: 12px; font-weight: bold; color: #00a2ff;
      text-transform: uppercase; margin-top: 10px; letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(0, 162, 255, 0.2); padding-bottom: 4px;
    }

    .slider-group { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
    .slider-row { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; }
    input[type="range"] { width: 100%; accent-color: #00a2ff; cursor: pointer; }

    /* Galeriile cu miniaturi */
    .gallery-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px;
    }
    .gallery-item {
      position: relative; width: 100%; aspect-ratio: 1; border-radius: 6px; overflow: hidden;
      border: 2px solid #333; cursor: pointer; background: #111;
    }
    .gallery-item.active { border-color: #00a2ff; box-shadow: 0 0 8px #00a2ff; }
    .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }
    
    .btn-delete {
      position: absolute; top: 2px; right: 2px; background: #e74c3c;
      color: white; border: none; font-size: 10px; width: 16px; height: 16px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-weight: bold; line-height: 1; z-index: 5;
    }

    .upload-btn {
      background: #1e272e; border: 1px dashed #00a2ff; color: #00a2ff;
      padding: 10px; border-radius: 6px; text-align: center; cursor: pointer;
      font-weight: bold; font-size: 12px; display: block; margin-top: 6px;
    }

    .btn-record {
      background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 20px;
      font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 12px;
    }
    .btn-record.recording { background: #27ae60; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(39, 174, 96, 0); }
      100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
    }
  </style>
</head>
<body>

  <!-- Previzualizare Verticala -->
  <div id="preview-container">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="overlay-controls">
      <button id="recordBtn" class="btn-record" onclick="toggleRecording()">
        <span style="height: 8px; width: 8px; background: white; border-radius: 50%;"></span>
        <span id="recordText">Inregistrare MP4</span>
      </button>
      <button class="btn-action" style="padding: 5px 10px; font-size: 11px;" onclick="toggleFullscreen()">📺 Fullscreen</button>
    </div>
  </div>

  <!-- Panou Control Centrat Sub Video -->
  <div id="main-panel">

    <div class="btn-grid">
      <button id="btnCamera" class="btn-action active" onclick="toggleCameraReal()">Camera Reala: ON</button>
      <button id="btnFlipH" class="btn-action" onclick="toggleFlipH()">Oglindire (Flip H)</button>
    </div>

    <button class="btn-action btn-green" onclick="toggleFullscreen()">📺 Full Screen (Ecran Complet)</button>

    <!-- GALERIE FUNDAL -->
    <div class="section-title">🖼️ / 🎥 Fundal Scenă</div>
    <label class="upload-btn">
      + Upload Fundal Nou (Foto / Video)
      <input type="file" id="bgUpload" accept="image/*, video/*" multiple style="display:none;">
    </label>
    <div id="bgGallery" class="gallery-grid"></div>

    <!-- GALERIE MASCA -->
    <div class="section-title">🎭 Avatar / Mască PNG</div>
    <label class="upload-btn">
      + Upload Mască Nouă (PNG)
      <input type="file" id="maskUpload" accept="image/png" multiple style="display:none;">
    </label>
    <div id="maskGallery" class="gallery-grid"></div>

    <!-- CALIBRARE SI POZITIE -->
    <div class="section-title">⚙️️ Calibrare & Pozitie Masca</div>
    
    <div class="slider-group">
      <div class="slider-row"><span>Scale Latime / Inaltime:</span><span id="scaleVal">1.0x</span></div>
      <input type="range" id="maskScale" min="0.1" max="4.0" step="0.05" value="1.0">
    </div>

    <div class="slider-group">
      <div class="slider-row"><span>Offset Pozitie X (Stanga/Dreapta):</span></div>
      <input type="range" id="maskOffsetX" min="-300" max="300" step="1" value="0">
    </div>

    <div class="slider-group">
      <div class="slider-row"><span>Offset Pozitie Y (Sus/Jos):</span></div>
      <input type="range" id="maskOffsetY" min="-300" max="300" step="1" value="0">
    </div>

    <div class="slider-group">
      <div class="slider-row"><span>Rotire Manuala (°):</span></div>
      <input type="range" id="maskRotate" min="-180" max="180" step="1" value="0">
    </div>

  </div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const previewContainer = document.getElementById('preview-container');

  let activeMaskImg = null;
  let activeBgMedia = null;
  let showCamera = true;
  let flipH = false;

  let maskScale = 1.0;
  let maskOffsetX = 0;
  let maskOffsetY = 0;
  let maskRotate = 0;

  let maskList = [];
  let bgList = [];

  // Gesture & Touch Control direct pe ecran
  let isDragging = false;
  let startX = 0, startY = 0;
  let initialPinchDist = null;

  window.addEventListener('load', async () => {
    loadGalleries();
    await initCamera();
    initTouchEvents();
  });

  async function initCamera() {
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
      },
      width: 1280, height: 720
    });
    camera.start();
  }

  // Mediapipe FaceMesh Setup
  const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });
  faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
  
  faceMesh.onResults((results) => {
    renderScene(results);
  });

  // Render Loop
  function renderScene(results) {
    canvasElement.width = previewContainer.clientWidth || 720;
    canvasElement.height = previewContainer.clientHeight || 1280;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    if (flipH) {
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
    }

    // 1. Deseneaza Fundalul
    if (activeBgMedia) {
      canvasCtx.drawImage(activeBgMedia, 0, 0, canvasElement.width, canvasElement.height);
    }

    // 2. Deseneaza Corpul Reala (Video Stream)
    if (showCamera && results.image) {
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
    }

    // 3. Deseneaza Masca pe Fata
    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
      drawMask(results.multiFaceLandmarks[0]);
    }

    canvasCtx.restore();
  }

  function drawMask(landmarks) {
    if (!activeMaskImg) return;

    const top = landmarks[10], bottom = landmarks[152], left = landmarks[234], right = landmarks[454];
    const cx = (((left.x + right.x) / 2) * canvasElement.width) + maskOffsetX;
    const cy = (((top.y + bottom.y) / 2) * canvasElement.height) + maskOffsetY;

    const width = Math.hypot((right.x - left.x) * canvasElement.width, (right.y - left.y) * canvasElement.height) * 2.2 * maskScale;
    const height = width * (activeMaskImg.height / activeMaskImg.width);
    const autoAngle = Math.atan2((right.y - left.y) * canvasElement.height, (right.x - left.x) * canvasElement.width);
    const totalAngle = autoAngle + (maskRotate * Math.PI / 180);

    canvasCtx.save();
    canvasCtx.translate(cx, cy);
    canvasCtx.rotate(totalAngle);
    canvasCtx.drawImage(activeMaskImg, -width / 2, -height / 2, width, height);
    canvasCtx.restore();
  }

  // Touch & Mouse Control Direct Pe Masca
  function initTouchEvents() {
    canvasElement.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - maskOffsetX;
      startY = e.clientY - maskOffsetY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      maskOffsetX = e.clientX - startX;
      maskOffsetY = e.clientY - startY;
      document.getElementById('maskOffsetX').value = maskOffsetX;
      document.getElementById('maskOffsetY').value = maskOffsetY;
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    canvasElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      maskScale += e.deltaY * -0.001;
      maskScale = Math.min(Math.max(0.1, maskScale), 4.0);
      document.getElementById('maskScale').value = maskScale;
      document.getElementById('scaleVal').innerText = maskScale.toFixed(2) + 'x';
    }, { passive: false });
  }

  // UI Handlers & Toggles
  function toggleCameraReal() {
    showCamera = !showCamera;
    const btn = document.getElementById('btnCamera');
    btn.innerText = `Camera Reala: ${showCamera ? 'ON' : 'OFF'}`;
    btn.classList.toggle('active', showCamera);
  }

  function toggleFlipH() {
    flipH = !flipH;
    document.getElementById('btnFlipH').classList.toggle('active', flipH);
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      if (previewContainer.requestFullscreen) previewContainer.requestFullscreen();
      else if (previewContainer.webkitRequestFullscreen) previewContainer.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  }

  // Event Sliders
  document.getElementById('maskScale').addEventListener('input', (e) => {
    maskScale = parseFloat(e.target.value);
    document.getElementById('scaleVal').innerText = maskScale.toFixed(2) + 'x';
  });
  document.getElementById('maskOffsetX').addEventListener('input', (e) => maskOffsetX = parseInt(e.target.value));
  document.getElementById('maskOffsetY').addEventListener('input', (e) => maskOffsetY = parseInt(e.target.value));
  document.getElementById('maskRotate').addEventListener('input', (e) => maskRotate = parseInt(e.target.value));

  // Galerie Masti PNG
  document.getElementById('maskUpload').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (event) => {
        maskList.push(event.target.result);
        saveGalleries();
        renderMaskGallery();
      };
      reader.readAsDataURL(file);
    });
  });

  // Galerie Fundal
  document.getElementById('bgUpload').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (event) => {
        bgList.push({ src: event.target.result, type: file.type.startsWith('video/') ? 'video' : 'image' });
        saveGalleries();
        renderBgGallery();
      };
      reader.readAsDataURL(file);
    });
  });

  function renderMaskGallery() {
    const container = document.getElementById('maskGallery');
    container.innerHTML = '';
    maskList.forEach((src, idx) => {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      div.innerHTML = `<img src="${src}"><button class="btn-delete" onclick="deleteMask(${idx}, event)">X</button>`;
      div.onclick = () => {
        document.querySelectorAll('#maskGallery .gallery-item').forEach(el => el.classList.remove('active'));
        div.classList.add('active');
        const img = new Image();
        img.src = src;
        img.onload = () => { activeMaskImg = img; };
      };
      container.appendChild(div);
    });
  }

  function renderBgGallery() {
    const container = document.getElementById('bgGallery');
    container.innerHTML = '';
    bgList.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      div.innerHTML = item.type === 'video' 
        ? `<video src="${item.src}" muted loop></video><button class="btn-delete" onclick="deleteBg(${idx}, event)">X</button>`
        : `<img src="${item.src}"><button class="btn-delete" onclick="deleteBg(${idx}, event)">X</button>`;
      
      div.onclick = () => {
        document.querySelectorAll('#bgGallery .gallery-item').forEach(el => el.classList.remove('active'));
        div.classList.add('active');
        if (item.type === 'video') {
          const v = document.createElement('video');
          v.src = item.src; v.autoplay = true; v.loop = true; v.muted = true; v.play();
          activeBgMedia = v;
        } else {
          const img = new Image();
          img.src = item.src;
          img.onload = () => { activeBgMedia = img; };
        }
      };
      container.appendChild(div);
    });
  }

  function deleteMask(idx, e) {
    e.stopPropagation();
    maskList.splice(idx, 1);
    if (maskList.length === 0) activeMaskImg = null;
    saveGalleries();
    renderMaskGallery();
  }

  function deleteBg(idx, e) {
    e.stopPropagation();
    bgList.splice(idx, 1);
    if (bgList.length === 0) activeBgMedia = null;
    saveGalleries();
    renderBgGallery();
  }

  function saveGalleries() {
    try {
      localStorage.setItem('vt_masks', JSON.stringify(maskList));
      localStorage.setItem('vt_bgs', JSON.stringify(bgList));
    } catch (e) {}
  }

  function loadGalleries() {
    const savedMasks = localStorage.getItem('vt_masks');
    const savedBgs = localStorage.getItem('vt_bgs');
    if (savedMasks) { maskList = JSON.parse(savedMasks); renderMaskGallery(); }
    if (savedBgs) { bgList = JSON.parse(savedBgs); renderBgGallery(); }
  }

  // Inregistrare MP4
  let mediaRecorder = null, recordedChunks = [], isRecording = false;

  function toggleRecording() {
    if (!isRecording) startRecording();
    else stopRecording();
  }

  function startRecording() {
    recordedChunks = [];
    const stream = canvasElement.captureStream(30);
    let mimeType = 'video/mp4';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm;codecs=h264';

    mediaRecorder = new MediaRecorder(stream, { mimeType });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = downloadVideo;

    mediaRecorder.start();
    isRecording = true;
    document.getElementById('recordBtn').classList.add('recording');
    document.getElementById('recordText').innerText = "Stop & Salveaza";
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      document.getElementById('recordBtn').classList.remove('recording');
      document.getElementById('recordText').innerText = "Inregistrare MP4";
    }
  }

  function downloadVideo() {
    const blob = new Blob(recordedChunks, { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `VTuber_Event_${Date.now()}.mp4`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
  }
</script>
</body>
</html>
