<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTuber Studio v1.5 - Full Control & Calibration</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --panel-bg: #1f2937;
      --accent-color: #0088ff;
      --accent-hover: #0066cc;
      --text-color: #ffffff;
      --text-muted: #9ca3af;
      --border-color: #374151;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .app-title {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 12px;
    }

    /* Zona de vizualizare / Display Canvas */
    .viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--accent-color);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .viewport:active {
      cursor: grabbing;
    }

    .background-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .avatar-container {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 2;
      transform-origin: center center;
      pointer-events: none;
    }

    .avatar-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .avatar-container.ai-crop-on .avatar-image {
      object-fit: cover;
      min-width: 120%;
      min-height: 120%;
    }

    /* Meniu Comenzi & Butoane */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      background: var(--panel-bg);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn.active {
      background: var(--accent-color);
      border-color: #60a5fa;
    }

    .btn-full {
      grid-column: span 2;
    }

    .btn-fullscreen {
      background: #10b981;
      border-color: #059669;
    }

    .btn-fullscreen:hover {
      background: #059669;
    }

    /* Secțiuni Încarcare & Calibrare */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 14px 0 8px 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .upload-zone {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-input-hidden {
      display: none;
    }

    .upload-btn {
      display: block;
      width: 100%;
      padding: 8px;
      background: #1f2937;
      border: 1px dashed var(--accent-color);
      border-radius: 6px;
      color: var(--accent-color);
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .preview-thumb {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-color);
    }

    /* Glisoare (Sliders) */
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }

    .slider-row label {
      color: #d1d5db;
      width: 40%;
    }

    .slider-row input[type="range"] {
      width: 58%;
      accent-color: var(--accent-color);
    }

    .status-bar {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #10b981;
    }
  </style>
</head>
<body>

<div class="app-card" id="appCard">
  <div class="app-title">VTuber Studio v1.5 - Square 1:1</div>

  <!-- Zona de Afișare Principala (Ecran/Camera) -->
  <div class="viewport" id="viewport">
    <img src="https://via.placeholder.com/600x600/111827/ffffff?text=Fundal+Scena" id="bgLayer" class="background-layer" alt="Fundal">
    <div class="avatar-container ai-crop-on" id="avatarContainer">
      <img src="https://via.placeholder.com/400x400/0088ff/ffffff?text=Upload+Avatar+PNG" id="avatarImg" class="avatar-image" alt="Avatar PNG">
    </div>
  </div>

  <!-- Butoane Principale & Comenzi -->
  <div class="btn-grid">
    <button class="btn active" id="btnCamera" onclick="toggleCamera()">Camera Reală: ON</button>
    <button class="btn active" id="btnAiCrop" onclick="toggleAiCrop()">AI Cut-Off / Crop: ON</button>
    <button class="btn" onclick="autoCalibrateCenter()">Autocalibrare Centru</button>
    <button class="btn" onclick="resetTransform()">Reset Poziție Touch</button>
    <button class="btn btn-full btn-fullscreen" onclick="toggleFullScreen()">🖥️ Intrare / Ieșire Full Screen</button>
  </div>

  <!-- Incarcare Fundal Scenă -->
  <div class="section-title">🖼️ Fundal Scenă</div>
  <div class="upload-zone">
    <label class="upload-btn" for="bgInput">+ Upload Fundal</label>
    <input type="file" id="bgInput" class="file-input-hidden" accept="image/*" onchange="loadBackground(event)">
  </div>

  <!-- Incarcare Avatar / Mască PNG -->
  <div class="section-title">🎭 Avatar / Mască PNG</div>
  <div class="upload-zone">
    <label class="upload-btn" for="avatarInput">+ Upload Avatar PNG</label>
    <input type="file" id="avatarInput" class="file-input-hidden" accept="image/png, image/*" onchange="loadAvatar(event)">
  </div>

  <!-- Calibrare Mască -->
  <div class="section-title">⚙️ Calibrare Mască (Avatar)</div>
  <div class="slider-group">
    <div class="slider-row">
      <label>Scale Avatar (Size):</label>
      <input type="range" id="scaleSlider" min="0.5" max="3" step="0.05" value="1.2" oninput="updateFromSliders()">
    </div>
    <div class="slider-row">
      <label>Offset Mască X:</label>
      <input type="range" id="offsetXSlider" min="-200" max="200" value="0" oninput="updateFromSliders()">
    </div>
    <div class="slider-row">
      <label>Offset Mască Y:</label>
      <input type="range" id="offsetYSlider" min="-200" max="200" value="0" oninput="updateFromSliders()">
    </div>
  </div>

  <!-- Ajustare Fină Gură -->
  <div class="section-title">👄 Ajustare Fină Gură</div>
  <div class="slider-group">
    <div class="slider-row">
      <label>Fine-Tune Gură X:</label>
      <input type="range" min="-50" max="50" value="0">
    </div>
    <div class="slider-row">
      <label>Fine-Tune Gură Y:</label>
      <input type="range" min="-50" max="50" value="0">
    </div>
    <div class="slider-row">
      <label>Lățime Gură (Width):</label>
      <input type="range" min="10" max="100" value="50">
    </div>
    <div class="slider-row">
      <label>Sensibilitate Deschidere:</label>
      <input type="range" min="1" max="100" value="60">
    </div>
  </div>

  <div class="status-bar">v1.5 Square 1:1 Active 🟢</div>
</div>

<script>
  // Stări pentru Pozitionare, Zoom și AI Crop
  let scale = 1.2;
  let posX = 0;
  let posY = 0;
  let isAiCropOn = true;
  let isCameraOn = true;

  const avatarContainer = document.getElementById('avatarContainer');
  const avatarImg = document.getElementById('avatarImg');
  const bgLayer = document.getElementById('bgLayer');
  const viewport = document.getElementById('viewport');

  const scaleSlider = document.getElementById('scaleSlider');
  const offsetXSlider = document.getElementById('offsetXSlider');
  const offsetYSlider = document.getElementById('offsetYSlider');

  // Actualizare Transformări Vizuale
  function applyTransform() {
    avatarContainer.style.transform = `translate(-50%, -50%) translate(${posX}px, ${posY}px) scale(${scale})`;
    scaleSlider.value = scale;
    offsetXSlider.value = posX;
    offsetYSlider.value = posY;
  }

  function updateFromSliders() {
    scale = parseFloat(scaleSlider.value);
    posX = parseInt(offsetXSlider.value);
    posY = parseInt(offsetYSlider.value);
    applyTransform();
  }

  // Upload Fundal
  function loadBackground(e) {
    const file = e.target.files[0];
    if (file) {
      bgLayer.src = URL.createObjectURL(file);
    }
  }

  // Upload Avatar PNG
  function loadAvatar(e) {
    const file = e.target.files[0];
    if (file) {
      avatarImg.src = URL.createObjectURL(file);
    }
  }

  // Toggle Camera
  function toggleCamera() {
    isCameraOn = !isCameraOn;
    const btn = document.getElementById('btnCamera');
    btn.classList.toggle('active', isCameraOn);
    btn.innerText = `Camera Reală: ${isCameraOn ? 'ON' : 'OFF'}`;
  }

  // Toggle AI Crop & Fit
  function toggleAiCrop() {
    isAiCropOn = !isAiCropOn;
    const btn = document.getElementById('btnAiCrop');
    btn.classList.toggle('active', isAiCropOn);
    btn.innerText = `AI Cut-Off / Crop: ${isAiCropOn ? 'ON' : 'OFF'}`;
    
    if (isAiCropOn) {
      avatarContainer.classList.add('ai-crop-on');
      scale = 1.2;
    } else {
      avatarContainer.classList.remove('ai-crop-on');
      scale = 1.0;
    }
    applyTransform();
  }

  // Autocalibrare Centru
  function autoCalibrateCenter() {
    posX = 0;
    posY = 0;
    scale = 1.25;
    applyTransform();
  }

  // Reset Poziție Touch / Mouse
  function resetTransform() {
    posX = 0;
    posY = 0;
    scale = isAiCropOn ? 1.2 : 1.0;
    applyTransform();
  }

  // Comutator Full Screen
  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.getElementById('appCard').requestFullscreen().catch(err => {
        alert("Eroare la pornirea modulului Full Screen.");
      });
    } else {
      document.exitFullscreen();
    }
  }

  // Interacțiune directă cu Mouse Drag pe Ecran
  let isDragging = false;
  let startX, startY;

  viewport.addEventListener('mousedown', (e) => {
    isDragging = true;
    startX = e.clientX - posX;
    startY = e.clientY - posY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    applyTransform();
  });

  window.addEventListener('mouseup', () => { isDragging = false; });

  // Zoom cu Rotița Mouse-ului
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 0.05 : -0.05;
    scale = Math.min(Math.max(0.5, scale + zoomFactor), 3.0);
    applyTransform();
  }, { passive: false });

  // Initalizare
  applyTransform();
</script>

</body>
</html>
