<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VTuber Studio v2.5 - Camera Fixed & Record MP4</title>

  <!-- MediaPipe CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="canvas-container" id="canvasContainer">
    <video id="webcam" playsinline muted></video>
  </div>

  <div class="controls-panel">
    <div class="btn-group">
      <button id="recordBtn" class="btn btn-full btn-record">⏺ Începe Înregistrarea Video (MP4)</button>
      <button id="toggleShowCam" class="btn">Camera Reală: OFF</button>
      <button id="toggleAiCut" class="btn">AI Cut-Off: OFF</button>
      <button id="toggleBodyTrack" class="btn">Urmărire Corp: OFF</button>
    </div>
  </div>

  <script>
    let startTouchX = 0;
    let startTouchY = 0;

    let savedBgs = JSON.parse(localStorage.getItem('vtuber_bgs_v25') || '[]');
    let savedAvatars = JSON.parse(localStorage.getItem('vtuber_avatars_v25') || '[]');

    const sliders = [scaleWidthSlider, scaleHeightSlider, rotationSlider, offsetXSlider, offsetYSlider, mouthXSlider, mouthYSlider, mouthWidthSlider, mouthSensSlider];

    function saveState() {
      const state = {
        activeAvatarIndex: savedAvatars.findIndex(a => activeAvatar && activeAvatar.src === a)
      };

      sliders.forEach(s => state[s.id] = s.value);

      localStorage.setItem('vtuber_app_state_v25', JSON.stringify(state));
    }

    function loadState() {
      const saved = JSON.parse(localStorage.getItem('vtuber_app_state_v25') || '{}');

      flipH = saved.flipH || false;
      flipV = saved.flipV || false;
    }

    // --- Înregistrare Video MP4 ---
    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        startRecording();
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove('recording');
        recordBtn.innerText = '⏺ Începe Înregistrarea Video (MP4)';
      }
    });

    function downloadVideo(url) {
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = `VTuber_Studio_v2.5_${Date.now()}.mp4`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
    }

    function renderGalleries() {
      try {
        localStorage.setItem('vtuber_bgs_v25', JSON.stringify(savedBgs));
        localStorage.setItem('vtuber_avatars_v25', JSON.stringify(savedAvatars));
      } catch(e) {
        console.warn("Memorie stocare plină.");
      }
    }

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      latestFaceResults = results;
    });

    const pose = new Pose({
      // configurare pose...
    });

    async function initCamera() {
      try {
        videoElement.srcObject = stream;
        await videoElement.play();

        const camera = new Camera(videoElement, {
          onFrame: async () => {
            if (isAiCutOn || showRealCam) {
              await selfieSegmentation.send({ image: videoElement });
            }
            if (isBodyTrackOn) {
              await pose.send({ image: videoElement });
            }
            await faceMesh.send({ image: videoElement });
          },
          width: 500,
          height: 500
        });
        camera.start();

        function renderLoop() {
          drawScene();
          requestAnimationFrame(renderLoop);
        }
        renderLoop();

      } catch(err) {
        statusEl.innerText = "Eroare la pornirea camerei! Verificați permisiunile.";
      }
    }
  </script>
</body>
</html>
