<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VTuber Studio v2.1 - Galerie & Memorie Media</title>

  <!-- MediaPipe CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      padding: 10px;
      background: #090d16;
      color: #38bdf8;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h3 { margin: 4px 0 10px 0; color: #38bdf8; text-align: center; font-size: 16px; }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1/1;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #0284c7;
      background: #000;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.2);
      touch-action: none;
      cursor: grab;
    }

    .canvas-container:active { cursor: grabbing; }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #bgVideoElement { display: none; }

    .controls-panel {
      width: 100%;
      max-width: 400px;
      margin-top: 10px;
      background: #111827;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #1f2937;
      font-size: 12px;
    }

    .section-title {
      font-weight: bold;
      color: #94a3b8;
      margin: 10px 0 6px 0;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 2px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .btn {
      flex: 1 1 calc(50% - 6px);
      padding: 8px;
      background: #1e293b;
      border: 1px solid #0284c7;
      color: #38bdf8;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      font-size: 11px;
      transition: all 0.2s;
    }

    .btn.active {
      background: #0284c7;
      color: #fff;
    }

    .btn-full { flex: 1 1 100%; }

    .btn-fullscreen {
      background: #10b981;
      border-color: #059669;
      color: #fff;
    }

    input[type="file"] { display: none; }

    /* Galeriile cu miniaturi salvate */
    .gallery {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 8px 0;
      margin-bottom: 6px;
      min-height: 62px;
    }

    .gallery-item {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 6px;
      border: 2px solid #334155;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      background: #000;
    }

    .gallery-item.active { 
      border-color: #38bdf8; 
      box-shadow: 0 0 8px #38bdf8;
    }
    
    .gallery-item img, .gallery-item video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }

    .delete-btn {
      position: absolute;
      top: 1px;
      right: 1px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    label { color: #94a3b8; }
    input[type="range"] { width: 55%; accent-color: #38bdf8; }

    #status {
      font-size: 11px;
      color: #eab308;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <h3>🎭 VTuber Studio v2.1</h3>

  <div class="canvas-container" id="canvasContainer">
    <video id="webcam" playsinline style="display:none;"></video>
    <video id="bgVideoElement" loop playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="controls-panel">
    
    <div class="btn-group">
      <button id="toggleShowCam" class="btn">Camera Reală: OFF</button>
      <button id="toggleAiCut" class="btn">AI Cut-Off: OFF</button>
      <button id="toggleBodyTrack" class="btn">Urmărire Corp: OFF</button>
      <button id="btnCrop" class="btn">AI Crop OFF</button>
      <button id="autoCalibrateBtn" class="btn">🎯 Autocalibrare Centru</button>
      <button id="resetTouchBtn" class="btn">Reset Pozitie Touch</button>
      <button id="fullScreenBtn" class="btn btn-full btn-fullscreen">🖥️ Full Screen (Ecran Complet)</button>
    </div>

    <!-- Galerie Fundaluri -->
    <div class="section-title">🖼️ / 🎬 FUNDAL SCENĂ (MAX 10)</div>
    <div class="btn-group">
      <label class="btn" style="flex: 100%;">
        ➕ Upload Fundal Nou (Foto / Video)
        <input type="file" id="bgLoader" accept="image/*, video/*">
      </label>
    </div>
    <div class="gallery" id="bgGallery"></div>

    <!-- Galerie Avatare / Măști -->
    <div class="section-title">👽 AVATAR / MASCĂ PNG (MAX 10)</div>
    <div class="btn-group">
      <label class="btn" style="flex: 100%;">
        ➕ Upload Mască Nouă (PNG)
        <input type="file" id="avatarLoader" accept="image/*">
      </label>
    </div>
    <div class="gallery" id="avatarGallery"></div>

    <div class="section-title">🔄 ORIENTARE & FLIP MASCĂ</div>
    <div class="btn-group">
      <button id="btnFlipH" class="btn">Oglindire (Flip H)</button>
      <button id="btnFlipV" class="btn">Răsturnare (Flip V)</button>
    </div>
    <div class="row">
      <label>Rotire Manuală (°):</label>
      <input type="range" id="rotationSlider" min="0" max="360" step="1" value="0">
    </div>

    <div class="section-title">⚙️ CALIBRARE MASCĂ (ZOOM 0.1x - 20x)</div>
    <div class="row">
      <label>Scale Lățime (Width):</label>
      <input type="range" id="scaleWidthSlider" min="0.1" max="20" step="0.1" value="2.8">
    </div>
    <div class="row">
      <label>Scale Înălțime (Height):</label>
      <input type="range" id="scaleHeightSlider" min="0.1" max="20" step="0.1" value="2.8">
    </div>
    <div class="row">
      <label>Offset Mască X:</label>
      <input type="range" id="offsetXSlider" min="-500" max="500" step="1" value="0">
    </div>
    <div class="row">
      <label>Offset Mască Y:</label>
      <input type="range" id="offsetYSlider" min="-500" max="500" step="1" value="0">
    </div>

    <div class="section-title">👄 AJUSTARE FINĂ GURĂ</div>
    <div class="row">
      <label>Fine-Tune Gură X:</label>
      <input type="range" id="mouthXSlider" min="-100" max="100" step="1" value="0">
    </div>
    <div class="row">
      <label>Fine-Tune Gură Y:</label>
      <input type="range" id="mouthYSlider" min="-100" max="100" step="1" value="0">
    </div>
    <div class="row">
      <label>Lățime Gură (Width):</label>
      <input type="range" id="mouthWidthSlider" min="10" max="120" step="1" value="40">
    </div>
    <div class="row">
      <label>Sensibilitate Deschidere Gură:</label>
      <input type="range" id="mouthSensSlider" min="1" max="30" step="1" value="15">
    </div>

    <div id="status">Se inițializează camera... Permiteți accesul.</div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const bgVideoElement = document.getElementById('bgVideoElement');
    const canvasElement = document.getElementById('output_canvas');
    const canvasContainer = document.getElementById('canvasContainer');
    const canvasCtx = canvasElement.getContext('2d');
    const statusEl = document.getElementById('status');

    canvasElement.width = 500;
    canvasElement.height = 500;

    const segmentCanvas = document.createElement('canvas');
    segmentCanvas.width = 500;
    segmentCanvas.height = 500;
    const segmentCtx = segmentCanvas.getContext('2d');

    const toggleShowCamBtn = document.getElementById('toggleShowCam');
    const toggleAiCutBtn = document.getElementById('toggleAiCut');
    const toggleBodyTrackBtn = document.getElementById('toggleBodyTrack');
    const btnCrop = document.getElementById('btnCrop');
    const btnFlipH = document.getElementById('btnFlipH');
    const btnFlipV = document.getElementById('btnFlipV');
    const resetTouchBtn = document.getElementById('resetTouchBtn');
    const autoCalibrateBtn = document.getElementById('autoCalibrateBtn');
    const fullScreenBtn = document.getElementById('fullScreenBtn');

    const scaleWidthSlider = document.getElementById('scaleWidthSlider');
    const scaleHeightSlider = document.getElementById('scaleHeightSlider');
    const rotationSlider = document.getElementById('rotationSlider');
    const offsetXSlider = document.getElementById('offsetXSlider');
    const offsetYSlider = document.getElementById('offsetYSlider');

    const mouthXSlider = document.getElementById('mouthXSlider');
    const mouthYSlider = document.getElementById('mouthYSlider');
    const mouthWidthSlider = document.getElementById('mouthWidthSlider');
    const mouthSensSlider = document.getElementById('mouthSensSlider');

    const bgGallery = document.getElementById('bgGallery');
    const avatarGallery = document.getElementById('avatarGallery');

    let showRealCam = false;
    let isAiCutOn = false;
    let isBodyTrackOn = false;
    let isAiCropOn = false;
    let flipH = false;
    let flipV = false;

    let latestSegmentationMask = null;
    let latestFaceResults = null;
    let latestPoseResults = null;

    let activeBgType = null;
    let activeBgImage = null;
    let activeAvatar = null;

    let smoothX = 0, smoothY = 0, smoothAngle = 0, smoothEyeDist = 0;
    const lerp = (start, end, amt) => (1 - amt) * start + amt * end;

    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let isDragging = false;
    let startTouchX = 0;
    let startTouchY = 0;

    let savedBgs = JSON.parse(localStorage.getItem('vtuber_bgs_v21') || '[]');
    let savedAvatars = JSON.parse(localStorage.getItem('vtuber_avatars_v21') || '[]');

    const sliders = [scaleWidthSlider, scaleHeightSlider, rotationSlider, offsetXSlider, offsetYSlider, mouthXSlider, mouthYSlider, mouthWidthSlider, mouthSensSlider];

    function saveState() {
      const state = {
        flipH, flipV, showRealCam, isAiCutOn, isBodyTrackOn, isAiCropOn,
        dragOffsetX, dragOffsetY,
        activeBgIndex: savedBgs.findIndex(b => (b.type === activeBgType && ((b.type === 'image' && activeBgImage && activeBgImage.src === b.src) || (b.type === 'video' && bgVideoElement.src === b.src)))),
        activeAvatarIndex: savedAvatars.findIndex(a => activeAvatar && activeAvatar.src === a)
      };
      sliders.forEach(s => state[s.id] = s.value);
      localStorage.setItem('vtuber_app_state_v21', JSON.stringify(state));
    }

    function loadState() {
      const saved = JSON.parse(localStorage.getItem('vtuber_app_state_v21') || '{}');
      
      flipH = saved.flipH || false;
      flipV = saved.flipV || false;
      showRealCam = saved.showRealCam || false;
      isAiCutOn = saved.isAiCutOn || false;
      isBodyTrackOn = saved.isBodyTrackOn || false;
      isAiCropOn = saved.isAiCropOn || false;

      dragOffsetX = saved.dragOffsetX || 0;
      dragOffsetY = saved.dragOffsetY || 0;

      btnFlipH.classList.toggle('active', flipH);
      btnFlipV.classList.toggle('active', flipV);
      toggleShowCamBtn.classList.toggle('active', showRealCam);
      toggleShowCamBtn.innerText = `Camera Reală: ${showRealCam ? 'ON' : 'OFF'}`;
      toggleAiCutBtn.classList.toggle('active', isAiCutOn);
      toggleAiCutBtn.innerText = `AI Cut-Off: ${isAiCutOn ? 'ON' : 'OFF'}`;
      toggleBodyTrackBtn.classList.toggle('active', isBodyTrackOn);
      toggleBodyTrackBtn.innerText = `Urmărire Corp: ${isBodyTrackOn ? 'ON' : 'OFF'}`;
      btnCrop.classList.toggle('active', isAiCropOn);
      btnCrop.innerText = `AI Crop ${isAiCropOn ? 'ON' : 'OFF'}`;

      sliders.forEach(s => {
        if (saved[s.id] !== undefined) s.value = saved[s.id];
        s.addEventListener('input', saveState);
      });

      if (saved.activeBgIndex !== undefined && saved.activeBgIndex >= 0 && savedBgs[saved.activeBgIndex]) {
        selectBg(savedBgs[saved.activeBgIndex]);
      }

      if (saved.activeAvatarIndex !== undefined && saved.activeAvatarIndex >= 0 && savedAvatars[saved.activeAvatarIndex]) {
        selectAvatar(savedAvatars[saved.activeAvatarIndex]);
      }
    }
