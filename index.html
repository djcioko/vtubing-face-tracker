<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Maparereala V1 - Single Video 8 Points</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100vw; height: 100vh; overflow: hidden;
      background-color: #050508; color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #app-container {
      width: 100vw; height: 100vh; position: relative;
    }

    canvas {
      display: block; width: 100vw; height: 100vh;
      background: #000; cursor: crosshair;
    }

    #top-bar {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(10, 10, 20, 0.88); padding: 12px 16px;
      border-radius: 10px; border: 1px solid rgba(0, 255, 204, 0.4);
      backdrop-filter: blur(10px); display: flex; align-items: center; gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    #top-bar label {
      font-size: 11px; font-weight: bold; color: #00ffcc; text-transform: uppercase;
    }

    .file-input { color: #ddd; font-size: 11px; cursor: pointer; }

    .btn-action {
      background: rgba(255, 255, 255, 0.1); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2); padding: 5px 10px;
      font-size: 11px; border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .btn-action:hover { background: rgba(0, 255, 204, 0.2); border-color: #00ffcc; color: #00ffcc; }
    .btn-reset { border-color: #ff3366; color: #ff3366; }
    .btn-reset:hover { background: rgba(255, 51, 102, 0.2); }
  </style>
</head>
<body>

<div id="app-container">
  <div id="top-bar">
    <label>3D MAPAREREALA:</label>
    <input type="file" id="videoInput" accept="video/*,image/*" class="file-input">
    <button id="toggle-grid" class="btn-action">Puncte: ON</button>
    <button id="reset-btn" class="btn-action btn-reset">Resetare Grilă 8P</button>
  </div>

  <canvas id="canvas"></canvas>
</div>

<video id="vid" loop muted playsinline crossorigin="anonymous" style="display:none"></video>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const videoElem = document.getElementById('vid');
  const videoInput = document.getElementById('videoInput');
  const resetBtn = document.getElementById('reset-btn');
  const toggleGridBtn = document.getElementById('toggle-grid');

  let showGrid = true;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Matricea de 8 puncte pentru un singur videoclip (3 Sus, 2 Mijloc, 3 Jos)
  // Indexuri:
  // 0: Sus-Stânga,   1: Sus-Mijloc,   2: Sus-Dreapta
  // 3: Mijloc-Stânga,                 4: Mijloc-Dreapta
  // 5: Jos-Stânga,    6: Jos-Mijloc,   7: Jos-Dreapta
  function getDefaultPoints() {
    const w = canvas.width;
    const h = canvas.height;
    return [
      { x: w * 0.30, y: h * 0.20 }, { x: w * 0.50, y: h * 0.20 }, { x: w * 0.70, y: h * 0.20 },
      { x: w * 0.30, y: h * 0.50 },                               { x: w * 0.70, y: h * 0.50 },
      { x: w * 0.30, y: h * 0.80 }, { x: w * 0.50, y: h * 0.80 }, { x: w * 0.70, y: h * 0.80 }
    ];
  }

  let pts = JSON.parse(localStorage.getItem('3d_maparereala_config')) || getDefaultPoints();

  function saveConfig() {
    localStorage.setItem('3d_maparereala_config', JSON.stringify(pts));
  }

  resetBtn.addEventListener('click', () => {
    pts = getDefaultPoints();
    saveConfig();
  });

  toggleGridBtn.addEventListener('click', () => {
    showGrid = !showGrid;
    toggleGridBtn.innerText = `Puncte: ${showGrid ? 'ON' : 'OFF'}`;
  });

  videoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      videoElem.src = URL.createObjectURL(file);
      videoElem.play();
    }
  });

  // Logica de Drag-and-Drop
  let dragPtIndex = -1;
  let isDraggingWholeFrame = false;
  let lastMouse = { x: 0, y: 0 };

  function isPointInsidePolygon(p, vs) {
    let x = p.x, y = p.y, inside = false;
    for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
      let xi = vs[i].x, yi = vs[i].y, xj = vs[j].x, yj = vs[j].y;
      let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  canvas.addEventListener('mousedown', (e) => {
    const mouse = getMousePos(e);
    dragPtIndex = -1;
    isDraggingWholeFrame = false;

    if (showGrid) {
      for (let i = 0; i < pts.length; i++) {
        if (Math.hypot(pts[i].x - mouse.x, pts[i].y - mouse.y) < 25) {
          dragPtIndex = i;
          break;
        }
      }
    }

    // Contur poligonal format din punctele exterioare [0, 1, 2, 4, 7, 6, 5, 3]
    const outerPoly = [pts[0], pts[1], pts[2], pts[4], pts[7], pts[6], pts[5], pts[3]];
    if (dragPtIndex === -1 && isPointInsidePolygon(mouse, outerPoly)) {
      isDraggingWholeFrame = true;
    }

    lastMouse = mouse;
  });

  window.addEventListener('mousemove', (e) => {
    if (dragPtIndex === -1 && !isDraggingWholeFrame) return;

    const mouse = getMousePos(e);
    const dx = mouse.x - lastMouse.x;
    const dy = mouse.y - lastMouse.y;

    if (dragPtIndex !== -1) {
      pts[dragPtIndex].x = mouse.x;
      pts[dragPtIndex].y = mouse.y;
    } else if (isDraggingWholeFrame) {
      pts.forEach(p => { p.x += dx; p.y += dy; });
    }

    lastMouse = mouse;
    saveConfig();
  });

  window.addEventListener('mouseup', () => {
    dragPtIndex = -1;
    isDraggingWholeFrame = false;
  });

  // Algoritm de mapare triunghiulara UV (Afișează corect portiunea de video pe 3 puncte)
  function drawTriangleUV(media, p0, p1, p2, u0, v0, u1, v1, u2, v2) {
    const w = media.videoWidth || media.width || 1;
    const h = media.videoHeight || media.height || 1;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.closePath();
    ctx.clip();

    const x0 = p0.x, y0 = p0.y, x1 = p1.x, y1 = p1.y, x2 = p2.x, y2 = p2.y;
    const sx0 = u0 * w, sy0 = v0 * h, sx1 = u1 * w, sy1 = v1 * h, sx2 = u2 * w, sy2 = v2 * h;

    const denom = (sx0 * (sy1 - sy2) + sx1 * (sy2 - sy0) + sx2 * (sy0 - sy1));
    if (Math.abs(denom) < 1e-5) { ctx.restore(); return; }

    const a = (x0 * (sy1 - sy2) + x1 * (sy2 - sy0) + x2 * (sy0 - sy1)) / denom;
    const c = (x0 * (sx2 - sx1) + x1 * (sx0 - sx2) + x2 * (sx1 - sx0)) / denom;
    const e = (x0 * (sx1 * sy2 - sx2 * sy1) + x1 * (sx2 * sy0 - sx0 * sy2) + x2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    const b = (y0 * (sy1 - sy2) + y1 * (sy2 - sy0) + y2 * (sy0 - sy1)) / denom;
    const d = (y0 * (sx2 - sx1) + y1 * (sx0 - sx2) + y2 * (sx1 - sx0)) / denom;
    const f = (y0 * (sx1 * sy2 - sx2 * sy1) + y1 * (sx2 * sy0 - sx0 * sy2) + y2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    ctx.transform(a, b, c, d, e, f);
    ctx.drawImage(media, 0, 0, w, h);
    ctx.restore();
  }

  // Mapează UN SINGUR VIDEOCLIP complet pe cele 8 puncte (6 triunghiuri)
  function renderSingleVideo8Points(media) {
    const [p0, p1, p2, p3, p4, p5, p6, p7] = pts;

    // Cadran 1: Stânga-Sus
    drawTriangleUV(media, p0, p1, p3, 0, 0,    0.5, 0,   0, 0.5);
    drawTriangleUV(media, p1, p4, p3, 0.5, 0,  0.5, 0.5, 0, 0.5);

    // Cadran 2: Dreapta-Sus
    drawTriangleUV(media, p1, p2, p4, 0.5, 0,  1, 0,     0.5, 0.5);
    drawTriangleUV(media, p2, p7, p4, 1, 0,    1, 0.5,   0.5, 0.5);

    // Cadran 3: Stânga-Jos
    drawTriangleUV(media, p3, p4, p5, 0, 0.5,  0.5, 0.5, 0, 1);
    drawTriangleUV(media, p4, p6, p5, 0.5, 0.5, 0.5, 1,  0, 1);

    // Cadran 4: Dreapta-Jos
    drawTriangleUV(media, p4, p7, p6, 0.5, 0.5, 1, 0.5,  0.5, 1);
    drawTriangleUV(media, p7, p7, p6, 1, 0.5,  1, 1,     0.5, 1);
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Renderizează un singur videoclip pe grila completă
    if (videoElem.readyState >= 2) {
      renderSingleVideo8Points(videoElem);
    }

    // Afișează grila și punctele de control
    if (showGrid) {
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 1.5;

      // Contur exterior & linii interioare
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y); ctx.lineTo(pts[2].x, pts[2].y);
      ctx.lineTo(pts[4].x, pts[4].y); ctx.lineTo(pts[7].x, pts[7].y); ctx.lineTo(pts[6].x, pts[6].y);
      ctx.lineTo(pts[5].x, pts[5].y); ctx.lineTo(pts[3].x, pts[3].y); ctx.closePath();
      
      ctx.moveTo(pts[1].x, pts[1].y); ctx.lineTo(pts[6].x, pts[6].y);
      ctx.moveTo(pts[3].x, pts[3].y); ctx.lineTo(pts[4].x, pts[4].y);
      ctx.stroke();

      // Cercurile celor 8 puncte
      pts.forEach((p, idx) => {
        ctx.fillStyle = (idx === 1 || idx === 6 || idx === 3 || idx === 4) ? '#ff0055' : '#00ffcc';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      });
    }

    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
