<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alien Sci-Fi VTuber Studio - DJ Cioko</title>

  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      background: #050811;
      color: #38bdf8;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h3 { margin: 4px 0 10px 0; color: #38bdf8; text-align: center; }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 4/3;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #0284c7;
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.3);
      background: #000;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .controls-panel {
      width: 100%;
      max-width: 500px;
      margin-top: 10px;
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      font-size: 13px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    label { font-size: 12px; color: #94a3b8; }

    input[type="range"] {
      width: 55%;
      accent-color: #38bdf8;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      flex: 1;
      padding: 8px;
      background: #1e293b;
      border: 1px solid #0284c7;
      color: #38bdf8;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
    }

    .btn.active {
      background: #0284c7;
      color: #fff;
    }

    input[type="file"] { display: none; }

    #status {
      font-size: 11px;
      color: #22c55e;
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <h3>👽 VTuber Studio Sci-Fi Spaceship</h3>

  <div class="canvas-container">
    <video id="webcam" playsinline style="display:none;"></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="controls-panel">
    <div class="btn-group">
      <button id="toggleAiCut" class="btn">AI Cut-Off: OFF</button>
      <label class="btn" style="margin:0;">
        📁 Upload Avatar
        <input type="file" id="imageLoader" accept="image/*">
      </label>
    </div>

    <div class="row">
      <label>Scală Avatar (Size):</label>
      <input type="range" id="scaleSlider" min="1" max="5" step="0.1" value="2.8">
    </div>
    <div class="row">
      <label>Offset Vertical (Y):</label>
      <input type="range" id="offsetYSlider" min="-100" max="100" step="1" value="0">
    </div>
    <div class="row">
      <label>Sensibilitate Gură:</label>
      <input type="range" id="mouthSensSlider" min="1" max="25" step="1" value="12">
    </div>

    <div id="status">Se încarcă modelele AI...</div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusEl = document.getElementById('status');

    canvasElement.width = 640;
    canvasElement.height = 480;

    // Setări Slidere
    const scaleSlider = document.getElementById('scaleSlider');
    const offsetYSlider = document.getElementById('offsetYSlider');
    const mouthSensSlider = document.getElementById('mouthSensSlider');
    const toggleAiCutBtn = document.getElementById('toggleAiCut');

    let isAiCutOn = false;
    let customImage = null;
    let personMask = null;
    let jawOpenValue = 0;

    // 1. Desenează Fundalul Procedural al Navei Spațiale (Sci-Fi Background Layer)
    function drawSpaceshipBackground(ctx, w, h) {
      // Perete fundal
      let bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, '#020617');
      bgGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Hublou / Fereastră Spațială
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(w / 2, h / 2 - 20, 220, 150, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#010409';
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#1e293b';
      ctx.stroke();

      // Stele în fundal
      ctx.fillStyle = '#ffffff';
      for(let i = 0; i < 20; i++) {
        let sx = (i * 37) % 400 + (w/2 - 200);
        let sy = (i * 23) % 250 + (h/2 - 120);
        ctx.fillRect(sx, sy, (i % 3) + 1, (i % 3) + 1);
      }
      ctx.restore();

      // Consola Navei / Lumini Sci-Fi
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, h - 80, w, 80);
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, h - 80); ctx.lineTo(w, h - 80);
      ctx.stroke();

      // Luminițe consolă
      ctx.fillStyle = '#22c55e'; ctx.fillRect(40, h - 50, 8, 8);
      ctx.fillStyle = '#ef4444'; ctx.fillRect(60, h - 50, 8, 8);
      ctx.fillStyle = '#38bdf8'; ctx.fillRect(80, h - 50, 20, 6);
    }

    // 2. Extraterestru Procedural SVG/Canvas în caz că nu există imagine încărcată
    function drawProceduralAlien(ctx, centerX, centerY, width, height, jawOpen) {
      ctx.save();
      ctx.translate(centerX, centerY);

      // Cap Extraterestru
      ctx.beginPath();
      ctx.ellipse(0, -20, width / 2.2, height / 1.8, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#3b82f6';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1d4ed8';
      ctx.stroke();

      // Ochi mari negri (Sci-Fi Alien)
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.ellipse(-width / 4, -40, width / 6, height / 5, Math.PI / 6, 0, Math.PI * 2);
      ctx.ellipse(width / 4, -40, width / 6, height / 5, -Math.PI / 6, 0, Math.PI * 2);
      ctx.fill();

      // Reflexii în ochi
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(-width / 4 + 5, -45, 5, 0, Math.PI * 2);
      ctx.arc(width / 4 - 5, -45, 5, 0, Math.PI * 2);
      ctx.fill();

      // Gura Dinamică (Se deschide după jawOpen)
      let mouthHeight = Math.max(4, jawOpen * 45);
      ctx.beginPath();
      ctx.ellipse(0, 30, width / 5, mouthHeight / 2, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      ctx.strokeStyle = '#60a5fa';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();
    }

    // AI Cut-off Setup (Selfie Segmentation)
    const selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });
    selfieSegmentation.setOptions({ modelSelection: 1 });
    selfieSegmentation.onResults((results) => {
      personMask = results.segmentationMask;
    });

    // FaceMesh Setup
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      statusEl.innerText = "Tracking Sci-Fi Activ 🟢";
      
      // Clear canvas
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Layer 0: Fundalul Navei
      drawSpaceshipBackground(canvasCtx, canvasElement.width, canvasElement.height);

      // Layer 1: Dacă AI Cut-Off e pornit, afișează doar corpul utilizatorului decupat
      if (isAiCutOn && personMask) {
        canvasCtx.save();
        canvasCtx.globalCompositeOperation = 'destination-over';
        canvasCtx.drawImage(personMask, 0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.globalCompositeOperation = 'source-in';
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.restore();
      }

      // Layer 2: Tracker & Avatar Overlay
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // Calculare Gură (jawOpen)
        const lipTop = landmarks[13];
        const lipBottom = landmarks[14];
        const jawDist = Math.hypot(lipTop.x - lipBottom.x, lipTop.y - lipBottom.y);
        const sens = parseFloat(mouthSensSlider.value);
        jawOpenValue = Math.min(Math.max((jawDist - 0.015) * sens, 0), 1);

        // Pozitionare cap
        const leftEye = landmarks[33];
        const rightEye = landmarks[263];
        const nose = landmarks[1];

        const dx = (rightEye.x - leftEye.x) * canvasElement.width;
        const dy = (rightEye.y - leftEye.y) * canvasElement.height;
        const angle = Math.atan2(dy, dx);

        const eyeDistance = Math.hypot(dx, dy);
        const scale = parseFloat(scaleSlider.value);
        const maskWidth = eyeDistance * scale;
        const maskHeight = maskWidth;

        const offsetY = parseFloat(offsetYSlider.value);
        const centerX = nose.x * canvasElement.width;
        const centerY = nose.y * canvasElement.height + offsetY;

        if (customImage && customImage.complete) {
          // Randare imagine încărcată (custom PNG)
          canvasCtx.save();
          canvasCtx.translate(centerX, centerY);
          canvasCtx.rotate(angle);
          canvasCtx.drawImage(customImage, -maskWidth / 2, -maskHeight / 2, maskWidth, maskHeight);
          
          // Suprapunere gură dinamică peste PNG
          let mouthHeight = Math.max(2, jawOpenValue * 30);
          canvasCtx.beginPath();
          canvasCtx.ellipse(0, maskHeight / 4, maskWidth / 6, mouthHeight / 2, 0, 0, Math.PI * 2);
          canvasCtx.fillStyle = '#000';
          canvasCtx.fill();
          canvasCtx.restore();
        } else {
          // Randare Extraterestru dinamic în cod
          drawProceduralAlien(canvasCtx, centerX, centerY, maskWidth, maskHeight, jawOpenValue);
        }
      }
    });

    // Upload Handler
    document.getElementById('imageLoader').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          customImage = new Image();
          customImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Toggle AI Cut-Off
    toggleAiCutBtn.addEventListener('click', () => {
      isAiCutOn = !isAiCutOn;
      toggleAiCutBtn.innerText = `AI Cut-Off: ${isAiCutOn ? 'ON' : 'OFF'}`;
      toggleAiCutBtn.classList.toggle('active', isAiCutOn);
    });

    // Loop Cameră
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        if (isAiCutOn) await selfieSegmentation.send({image: videoElement});
        await faceMesh.send({image: videoElement});
      },
      width: 640,
      height: 480
    });

    camera.start();
  </script>
</body>
</html>
