<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VTuber Studio v2.5 - Fixed Camera & Touch</title>

  <!-- MediaPipe CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    body, html { width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    
    .canvas-container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    canvas { width: 100%; height: 100%; object-fit: cover; }
    #webcam, #bgVideo { display: none; }
    
    /* Overlay Floating Buttons */
    .floating-btn {
      position: absolute; z-index: 100;
      background: rgba(0, 0, 0, 0.65); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; backdrop-filter: blur(4px); transition: transform 0.2s, background 0.2s;
    }
    .floating-btn:hover { transform: scale(1.1); background: rgba(0, 0, 0, 0.85); }
    
    #togglePanelBtn { top: 15px; left: 15px; }
    #quickRecordBtn { top: 15px; left: 68px; background: rgba(230, 57, 70, 0.8); }
    #quickRecordBtn.recording { background: #ff0000; animation: pulse 1s infinite; }
    #fullscreenToggle { top: 15px; right: 15px; border-radius: 8px; width: auto; padding: 0 12px; font-size: 13px; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* VU Meter Vizualizer */
    .vu-container {
      position: absolute; bottom: 15px; right: 15px; z-index: 100;
      display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.6);
      padding: 6px 10px; border-radius: 20px; border: 1px solid #333; backdrop-filter: blur(4px);
    }
    .vu-bar-bg { width: 80px; height: 10px; background: #222; border-radius: 5px; overflow: hidden; border: 1px solid #444; }
    .vu-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #2a9d8f, #e9c46a, #e63946); transition: width 0.05s ease; }

    /* Panou Controale */
    .controls-panel { 
      position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); 
      background: rgba(18, 18, 18, 0.92); padding: 14px; border-radius: 14px; 
      display: flex; flex-direction: column; gap: 10px; max-width: 95%; max-height: 55vh; 
      overflow-y: auto; z-index: 90; width: 460px; border: 1px solid #333;
      transition: opacity 0.3s ease, transform 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .controls-panel.hidden { opacity: 0; pointer-events: none; transform: translate(-50%, 25px); }
    
    .btn-group { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .btn { padding: 8px 10px; border: none; border-radius: 6px; background: #2a2a2a; color: white; cursor: pointer; font-size: 12px; }
    .btn:hover { background: #3d3d3d; }
    .btn-active { background: #2a9d8f !important; font-weight: bold; }
    
    .upload-section { display: flex; gap: 6px; }
    .file-input { display: none; }
    .btn-upload { background: #2a9d8f; flex: 1; text-align: center; }
    
    .gallery-container { display: flex; flex-direction: column; gap: 4px; }
    .gallery-label { font-size: 11px; color: #aaa; margin-top: 4px; }
    .gallery { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
    .gallery-item { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; border: 2px solid #444; cursor: pointer; flex-shrink: 0; }

    .slider-group { display: flex; flex-direction: column; gap: 5px; font-size: 11px; }
    .slider-row { display: flex; justify-content: space-between; align-items: center; }
    .slider-row input { width: 55%; }

    #status { position: absolute; top: 15px; left: 120px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 11px; z-index: 80; color: #888; }
  </style>
</head>
<body>

  <div id="status">Pornire VTuber Studio...</div>
  
  <!-- Butoane Rapide -->
  <button id="togglePanelBtn" class="floating-btn" title="Meniu">👁</button>
  <button id="quickRecordBtn" class="floating-btn" title="Înregistrare MP4">⏺</button>
  <button id="fullscreenToggle" class="floating-btn">🔲 Fullscreen</button>

  <!-- VU Meter Widget -->
  <div class="vu-container">
    <button id="toggleVuBtn" class="btn" style="padding: 2px 6px; font-size: 10px;">🎤 Mic: ON</button>
    <div class="vu-bar-bg"><div id="vuFill" class="vu-bar-fill"></div></div>
  </div>

  <div class="canvas-container" id="canvasContainer">
    <video id="webcam" playsinline muted></video>
    <video id="bgVideo" loop muted playsinline></video>
    <canvas id="mainCanvas"></canvas>
  </div>

  <div class="controls-panel" id="controlsPanel">
    <!-- Comutatoare Cam/AI/Mastră -->
    <div class="btn-group">
      <button id="toggleShowCam" class="btn">Camera Reală: OFF</button>
      <button id="toggleAiCut" class="btn">AI Cut-Off Corp: OFF</button>
      <button id="toggleMaskOnly" class="btn">Doar Mască VTuber: ON</button>
      <button id="toggleFlipH" class="btn">Oglindire Orizontală</button>
      <button id="toggleFlipV" class="btn">Oglindire Verticală</button>
    </div>

    <!-- Efecte Speciale Overlay -->
    <div class="gallery-label">Efecte Speciale Vizuale:</div>
    <div class="btn-group">
      <button id="toggleHearts" class="btn">💖 Inimioare: OFF</button>
      <button id="toggleSmoke" class="btn">💨 Fum RGB: OFF</button>
      <button id="toggleSparks" class="btn">✨ Scântei: OFF</button>
    </div>

    <!-- Upload Resurse -->
    <div class="upload-section">
      <label class="btn btn-upload">
        🖼 Upload Fundal (Foto/Video)
        <input type="file" id="bgUploader" class="file-input" accept="image/*,video/*">
      </label>
      <label class="btn btn-upload">
        🎭 Upload Față PNG
        <input type="file" id="avatarUploader" class="file-input" accept="image/*">
      </label>
    </div>

    <!-- Galerii Salvate LocalStorage -->
    <div class="gallery-container">
      <div class="gallery-label">Fundaluri Salvate:</div>
      <div class="gallery" id="bgGallery"></div>
      <div class="gallery-label">Avatare Salvate:</div>
      <div class="gallery" id="avatarGallery"></div>
    </div>

    <!-- Sliders Ajustare Avatar Față -->
    <div class="slider-group">
      <div class="slider-row"><label>Lățime Față:</label><input type="range" id="scaleWidthSlider" min="0.1" max="3" step="0.05" value="1"></div>
      <div class="slider-row"><label>Înălțime Față:</label><input type="range" id="scaleHeightSlider" min="0.1" max="3" step="0.05" value="1"></div>
      <div class="slider-row"><label>Rotație Față:</label><input type="range" id="rotationSlider" min="-180" max="180" step="1" value="0"></div>
      <div class="slider-row"><label>Offset X Față:</label><input type="range" id="offsetXSlider" min="-500" max="500" step="1" value="0"></div>
      <div class="slider-row"><label>Offset Y Față:</label><input type="range" id="offsetYSlider" min="-500" max="500" step="1" value="0"></div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const bgVideoElement = document.getElementById('bgVideo');
    const canvasElement = document.getElementById('mainCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusEl = document.getElementById('status');
    
    const controlsPanel = document.getElementById('controlsPanel');
    const togglePanelBtn = document.getElementById('togglePanelBtn');
    const quickRecordBtn = document.getElementById('quickRecordBtn');
    const fullscreenToggle = document.getElementById('fullscreenToggle');

    const vuFill = document.getElementById('vuFill');
    const toggleVuBtn = document.getElementById('toggleVuBtn');

    // UI Buttons & Sliders
    const toggleShowCam = document.getElementById('toggleShowCam');
    const toggleAiCut = document.getElementById('toggleAiCut');
    const toggleMaskOnly = document.getElementById('toggleMaskOnly');
    const toggleFlipH = document.getElementById('toggleFlipH');
    const toggleFlipV = document.getElementById('toggleFlipV');

    const toggleHearts = document.getElementById('toggleHearts');
    const toggleSmoke = document.getElementById('toggleSmoke');
    const toggleSparks = document.getElementById('toggleSparks');

    const bgUploader = document.getElementById('bgUploader');
    const avatarUploader = document.getElementById('avatarUploader');
    const bgGallery = document.getElementById('bgGallery');
    const avatarGallery = document.getElementById('avatarGallery');

    const scaleWidthSlider = document.getElementById('scaleWidthSlider');
    const scaleHeightSlider = document.getElementById('scaleHeightSlider');
    const rotationSlider = document.getElementById('rotationSlider');
    const offsetXSlider = document.getElementById('offsetXSlider');
    const offsetYSlider = document.getElementById('offsetYSlider');

    // Stări
    let showRealCam = false;
    let isAiCutOn = false;
    let isMaskOnly = true;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let flipH = false;
    let flipV = false;

    let fxHearts = false;
    let fxSmoke = false;
    let fxSparks = false;
    let micActive = true;

    let activeBgType = null;
    let activeBgImg = null;
    let activeAvatarImg = null;

    let savedBgs = JSON.parse(localStorage.getItem('vtuber_bgs_v25') || '[]');
    let savedAvatars = JSON.parse(localStorage.getItem('vtuber_avatars_v25') || '[]');

    const sliders = [scaleWidthSlider, scaleHeightSlider, rotationSlider, offsetXSlider, offsetYSlider];

    // Salvare / Încărcare
    function saveState() {
      const state = { flipH, flipV, showRealCam, isAiCutOn, isMaskOnly, fxHearts, fxSmoke, fxSparks };
      sliders.forEach(s => state[s.id] = s.value);
      localStorage.setItem('vtuber_app_state_v25', JSON.stringify(state));
    }

    function loadState() {
      const saved = JSON.parse(localStorage.getItem('vtuber_app_state_v25') || '{}');
      flipH = saved.flipH || false;
      flipV = saved.flipV || false;
      showRealCam = saved.showRealCam || false;
      isAiCutOn = saved.isAiCutOn || false;
      isMaskOnly = saved.isMaskOnly !== undefined ? saved.isMaskOnly : true;
      fxHearts = saved.fxHearts || false;
      fxSmoke = saved.fxSmoke || false;
      fxSparks = saved.fxSparks || false;

      sliders.forEach(s => { if (saved[s.id] !== undefined) s.value = saved[s.id]; });
      updateUIState();
    }

    function updateUIState() {
      toggleShowCam.innerText = `Camera Reală: ${showRealCam ? 'ON' : 'OFF'}`;
      toggleAiCut.innerText = `AI Cut-Off Corp: ${isAiCutOn ? 'ON' : 'OFF'}`;
      toggleMaskOnly.innerText = `Doar Mască VTuber: ${isMaskOnly ? 'ON' : 'OFF'}`;
      
      toggleHearts.innerText = `💖 Inimioare: ${fxHearts ? 'ON' : 'OFF'}`;
      toggleSmoke.innerText = `💨 Fum RGB: ${fxSmoke ? 'ON' : 'OFF'}`;
      toggleSparks.innerText = `✨ Scântei: ${fxSparks ? 'ON' : 'OFF'}`;

      toggleHearts.classList.toggle('btn-active', fxHearts);
      toggleSmoke.classList.toggle('btn-active', fxSmoke);
      toggleSparks.classList.toggle('btn-active', fxSparks);
    }

    sliders.forEach(s => s.addEventListener('input', saveState));

    togglePanelBtn.addEventListener('click', () => controlsPanel.classList.toggle('hidden'));
    fullscreenToggle.addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err));
      else if (document.exitFullscreen) document.exitFullscreen();
    });

    toggleShowCam.addEventListener('click', () => { showRealCam = !showRealCam; updateUIState(); saveState(); });
    toggleAiCut.addEventListener('click', () => { isAiCutOn = !isAiCutOn; updateUIState(); saveState(); });
    toggleMaskOnly.addEventListener('click', () => { isMaskOnly = !isMaskOnly; updateUIState(); saveState(); });
    toggleFlipH.addEventListener('click', () => { flipH = !flipH; saveState(); });
    toggleFlipV.addEventListener('click', () => { flipV = !flipV; saveState(); });

    toggleHearts.addEventListener('click', () => { fxHearts = !fxHearts; updateUIState(); saveState(); });
    toggleSmoke.addEventListener('click', () => { fxSmoke = !fxSmoke; updateUIState(); saveState(); });
    toggleSparks.addEventListener('click', () => { fxSparks = !fxSparks; updateUIState(); saveState(); });

    // Touch & Drag Direct pe Ecran (Fără inversări de axă)
    let touchState = { dragging: false, startX: 0, startY: 0, initialOffsetX: 0, initialOffsetY: 0, initialPinchDist: 0, initialScaleW: 1, initialScaleH: 1 };

    canvasElement.addEventListener('pointerdown', (e) => {
      touchState.dragging = true;
      touchState.startX = e.clientX;
      touchState.startY = e.clientY;
      touchState.initialOffsetX = parseFloat(offsetXSlider.value);
      touchState.initialOffsetY = parseFloat(offsetYSlider.value);
    });

    window.addEventListener('pointermove', (e) => {
      if (!touchState.dragging) return;
      const dx = e.clientX - touchState.startX;
      const dy = e.clientY - touchState.startY;
      // Mutare directă naturală fără inversări
      offsetXSlider.value = touchState.initialOffsetX + dx;
      offsetYSlider.value = touchState.initialOffsetY + dy;
      saveState();
    });

    window.addEventListener('pointerup', () => touchState.dragging = false);

    // Multitouch Pinch-to-Zoom pe mobil
    canvasElement.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        touchState.initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        touchState.initialScaleW = parseFloat(scaleWidthSlider.value);
        touchState.initialScaleH = parseFloat(scaleHeightSlider.value);
      }
    });

    canvasElement.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && touchState.initialPinchDist > 0) {
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const factor = dist / touchState.initialPinchDist;
        scaleWidthSlider.value = (touchState.initialScaleW * factor).toFixed(2);
        scaleHeightSlider.value = (touchState.initialScaleH * factor).toFixed(2);
        saveState();
      }
    });

    // Upload & Galerii
    bgUploader.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const res = evt.target.result;
          savedBgs.push({ data: res, type: file.type.startsWith('video') ? 'video' : 'image' });
          renderGalleries();
          selectBg(res, file.type.startsWith('video') ? 'video' : 'image');
        };
        reader.readAsDataURL(file);
      }
    });

    avatarUploader.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          savedAvatars.push(evt.target.result);
          renderGalleries();
          selectAvatar(evt.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    function selectBg(src, type) {
      activeBgType = type;
      if (type === 'video') {
        bgVideoElement.src = src;
        bgVideoElement.play();
      } else {
        bgVideoElement.pause();
        const img = new Image();
        img.src = src;
        img.onload = () => { activeBgImg = img; };
      }
    }

    function selectAvatar(src) {
      const img = new Image();
      img.src = src;
      img.onload = () => { activeAvatarImg = img; };
    }

    function renderGalleries() {
      try {
        localStorage.setItem('vtuber_bgs_v25', JSON.stringify(savedBgs));
        localStorage.setItem('vtuber_avatars_v25', JSON.stringify(savedAvatars));
      } catch(e) {}

      bgGallery.innerHTML = '';
      savedBgs.forEach(item => {
        const bgSrc = typeof item === 'string' ? item : item.data;
        const bgType = typeof item === 'string' ? 'image' : item.type;
        const el = document.createElement(bgType === 'video' ? 'video' : 'img');
        el.src = bgSrc;
        el.className = 'gallery-item';
        el.onclick = () => selectBg(bgSrc, bgType);
        bgGallery.appendChild(el);
      });

      avatarGallery.innerHTML = '';
      savedAvatars.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.className = 'gallery-item';
        img.onclick = () => selectAvatar(src);
        avatarGallery.appendChild(img);
      });
    }

    // Audio VU Meter Analyser
    let audioCtx, analyser, micStream;
    async function initAudioVU() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaStreamSource(micStream);
        source.connect(analyser);
        analyser.fftSize = 64;

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        function updateVU() {
          if (micActive) {
            analyser.getByteFrequencyData(dataArray);
            let average = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
            let val = Math.min(100, Math.max(0, average * 1.5));
            vuFill.style.width = `${val}%`;
          } else {
            vuFill.style.width = '0%';
          }
          requestAnimationFrame(updateVU);
        }
        updateVU();
      } catch (err) {
        console.log("Eroare acces microfon VU Meter:", err);
      }
    }

    toggleVuBtn.addEventListener('click', () => {
      micActive = !micActive;
      toggleVuBtn.innerText = `🎤 Mic: ${micActive ? 'ON' : 'OFF'}`;
    });

    // Particle FX Engine
    let particles = [];
    function drawParticles(w, h) {
      if (fxHearts && Math.random() < 0.1) {
        particles.push({ x: Math.random() * w, y: h + 20, speed: 1 + Math.random() * 2, size: 16 + Math.random() * 12, type: 'heart', alpha: 1 });
      }
      if (fxSmoke && Math.random() < 0.2) {
        particles.push({ x: Math.random() * w, y: h + 30, speed: 0.5 + Math.random() * 1.5, size: 30 + Math.random() * 40, type: 'smoke', alpha: 0.6, hue: (Date.now() / 20) % 360 });
      }
      if (fxSparks && Math.random() < 0.3) {
        particles.push({ x: Math.random() * w, y: Math.random() * h, speed: 0.2, size: 2 + Math.random() * 4, type: 'spark', alpha: 1, life: 30 });
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        if (p.type === 'heart') {
          p.y -= p.speed;
          canvasCtx.font = `${p.size}px sans-serif`;
          canvasCtx.fillText('💖', p.x, p.y);
          if (p.y < -20) particles.splice(i, 1);
        } else if (p.type === 'smoke') {
          p.y -= p.speed;
          p.alpha -= 0.003;
          canvasCtx.beginPath();
          canvasCtx.fillStyle = `hsla(${p.hue}, 80%, 60%, ${Math.max(0, p.alpha)})`;
          canvasCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          canvasCtx.fill();
          if (p.alpha <= 0 || p.y < -50) particles.splice(i, 1);
        } else if (p.type === 'spark') {
          p.life--;
          canvasCtx.beginPath();
          canvasCtx.fillStyle = `rgba(255, 225, 100, ${p.life / 30})`;
          canvasCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          canvasCtx.fill();
          if (p.life <= 0) particles.splice(i, 1);
        }
      }
    }

    // Înregistrare Video MP4
    quickRecordBtn.addEventListener('click', () => { if (!isRecording) startRecording(); else stopRecording(); });

    async function startRecording() {
      recordedChunks = [];
      const canvasStream = canvasElement.captureStream(30);
      let combinedStream = canvasStream;

      if (micStream && micActive) {
        combinedStream = new MediaStream([...canvasStream.getVideoTracks(), micStream.getAudioTracks()[0]]);
      }

      let options = { mimeType: 'video/webm;codecs=vp9' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };
      
      try { mediaRecorder = new MediaRecorder(combinedStream, options); } 
      catch (e) { mediaRecorder = new MediaRecorder(combinedStream); }

      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        downloadVideo(url);
      };

      mediaRecorder.start();
      isRecording = true;
      quickRecordBtn.classList.add('recording');
      quickRecordBtn.innerText = '⏹';
    }

    function stopRecording() {
      mediaRecorder.stop();
      isRecording = false;
      quickRecordBtn.classList.remove('recording');
      quickRecordBtn.innerText = '⏺';
    }

    function downloadVideo(url) {
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = `VTuber_Record_${Date.now()}.mp4`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
    }

    // MediaPipe Setup & Tracking Fix
    let latestFaceResults = null;
    let latestSegmentationResults = null;

    const faceMesh = new FaceMesh({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
    faceMesh.onResults((r) => { latestFaceResults = r; });

    const selfieSegmentation = new SelfieSegmentation({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}` });
    selfieSegmentation.setOptions({ modelSelection: 1 });
    selfieSegmentation.onResults((r) => { latestSegmentationResults = r; });

    // Render Main Canvas Loop
    function drawScene() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
      const w = canvasElement.width;
      const h = canvasElement.height;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, w, h);

      canvasCtx.translate(flipH ? w : 0, flipV ? h : 0);
      canvasCtx.scale(flipH ? -1 : 1, flipV ? -1 : 1);

      // 1. Fundal
      if (activeBgType === 'image' && activeBgImg) {
        canvasCtx.drawImage(activeBgImg, 0, 0, w, h);
      } else if (activeBgType === 'video' && bgVideoElement.readyState >= 2) {
        canvasCtx.drawImage(bgVideoElement, 0, 0, w, h);
      }

      // 2. Camera Reală
      if (showRealCam && videoElement.readyState >= 2) {
        if (isAiCutOn && latestSegmentationResults) {
          canvasCtx.save();
          canvasCtx.drawImage(latestSegmentationResults.segmentationMask, 0, 0, w, h);
          canvasCtx.globalCompositeOperation = 'source-in';
          canvasCtx.drawImage(videoElement, 0, 0, w, h);
          canvasCtx.restore();
        } else {
          canvasCtx.drawImage(videoElement, 0, 0, w, h);
        }
      }

      // 3. Mască PNG
      if (latestFaceResults && latestFaceResults.multiFaceLandmarks.length > 0) {
        statusEl.innerText = "Tracking Activ";
        const landmarks = latestFaceResults.multiFaceLandmarks[0];

        const nose = landmarks[1];
        const headX = nose.x * w + parseFloat(offsetXSlider.value);
        const headY = nose.y * h + parseFloat(offsetYSlider.value);

        const scaleW = parseFloat(scaleWidthSlider.value);
        const scaleH = parseFloat(scaleHeightSlider.value);
        const rot = parseFloat(rotationSlider.value) * Math.PI / 180;

        if (activeAvatarImg && isMaskOnly) {
          canvasCtx.save();
          canvasCtx.translate(headX, headY);
          canvasCtx.rotate(rot);
          const avW = activeAvatarImg.width * scaleW;
          const avH = activeAvatarImg.height * scaleH;
          canvasCtx.drawImage(activeAvatarImg, -avW / 2, -avH / 2, avW, avH);
          canvasCtx.restore();
        }
      } else {
        statusEl.innerText = "Căutare față...";
      }

      // 4. Efecte Particles
      drawParticles(w, h);

      canvasCtx.restore();
    }

    // Init Camera (Rulată corect prin window.Camera din camera_utils)
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
        videoElement.srcObject = stream;
        await videoElement.play();

        const camera = new window.Camera(videoElement, {
          onFrame: async () => {
            if (isAiCutOn || showRealCam) await selfieSegmentation.send({ image: videoElement });
            await faceMesh.send({ image: videoElement });
          },
          width: 640, height: 480
        });
        camera.start();

        function renderLoop() {
          drawScene();
          requestAnimationFrame(renderLoop);
        }
        renderLoop();

      } catch(err) {
        statusEl.innerText = "Eroare pornire cameră!";
        console.error(err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderGalleries();
      if (savedBgs.length > 0) {
        const firstBg = savedBgs[0];
        selectBg(typeof firstBg === 'string' ? firstBg : firstBg.data, typeof firstBg === 'string' ? 'image' : firstBg.type);
      }
      if (savedAvatars.length > 0) selectAvatar(savedAvatars[0]);
      initCamera();
      initAudioVU();
    });
  </script>
</body>
</html>
