<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VTuber Studio v3.0 - Full Recorder & VU Meter</title>
  
  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    
    #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #111; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
    video { display: none; }
    
    /* UI Panel Stânga */
    #ui-panel {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(8px);
      padding: 15px; border-radius: 10px; width: 310px; max-height: 90vh;
      overflow-y: auto; font-size: 13px; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    .group { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    label { display: block; margin-top: 6px; font-weight: 600; color: #ccc; }
    input[type="range"], input[type="file"], select, button {
      width: 100%; margin-top: 5px; padding: 6px; background: #222; color: #fff;
      border: 1px solid #444; border-radius: 6px; outline: none;
    }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .toggle-row input { width: auto; }

    /* Controls Overlay Vizibil și în Fullscreen */
    #fullscreen-overlay {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 99;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px);
      padding: 10px 20px; border-radius: 30px; display: flex; align-items: center; gap: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    /* Red Record Button */
    .btn-record {
      background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 20px;
      font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-record:hover { background: #c0392b; scale: 1.05; }
    .btn-record.recording { background: #27ae60; animation: pulse 1.5s infinite; }

    /* VU Meter Bar */
    .vu-meter-container { width: 120px; height: 12px; background: #333; border-radius: 6px; overflow: hidden; border: 1px solid #555; }
    .vu-meter-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #2ecc71 60%, #f1c40f 85%, #e74c3c 100%); transition: width 0.05s ease-out; }

    .btn-icon { background: #333; border: none; color: white; padding: 8px 12px; border-radius: 50%; cursor: pointer; }
    .btn-icon:hover { background: #555; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
      100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
    }
  </style>
</head>
<body>

<div id="container">
  <video id="webcam" playsinline></video>
  <canvas id="output_canvas"></canvas>

  <!-- Panou de control principal -->
  <div id="ui-panel">
    <h3>🎭 VTuber Studio v3.0</h3>
    
    <div class="group">
      <label>Dispozitiv Cameră Web:</label>
      <select id="cameraSelect"><option>Căutare camere...</option></select>
      <div id="status" style="color: #2ecc71; margin-top: 5px; font-weight: bold;">Se inițializează...</div>
    </div>

    <div class="group">
      <div class="toggle-row">
        <span>Urmărire Corp 3D (Pose)</span>
        <input type="checkbox" id="enablePose" checked>
      </div>
    </div>

    <div class="group">
      <label>Scalare Mască: <span id="scaleVal">1.0</span>x</label>
      <input type="range" id="maskScale" min="0.1" max="4.0" step="0.05" value="1.0">
      
      <label>Pozitie Y (Sus/Jos)</label>
      <input type="range" id="maskOffsetY" min="-150" max="150" step="1" value="0">
    </div>

    <div class="group">
      <label>Masca Personaj (PNG):</label>
      <input type="file" id="maskUpload" accept="image/png">
      <label>Fundal (Foto/Video):</label>
      <input type="file" id="bgUpload" accept="image/*, video/*">
    </div>

    <button onclick="toggleFullscreen()">🖥️ Fullscreen Mode</button>
  </div>

  <!-- Overlay vizibil pe Canvas (Inclusiv în Fullscreen) -->
  <div id="fullscreen-overlay">
    <button id="recordBtn" class="btn-record" onclick="toggleRecording()">
      <span id="recordDot" style="height: 10px; width: 10px; background: white; border-radius: 50%; display: inline-block;"></span>
      <span id="recordText">Record Video</span>
    </button>

    <div style="display: flex; align-items: center; gap: 8px;">
      <span>🎙️</span>
      <div class="vu-meter-container">
        <div id="vuBar" class="vu-meter-bar"></div>
      </div>
    </div>

    <button class="btn-icon" title="Comută Panoul de Control" onclick="toggleUIPanel()">⚙️</button>
  </div>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const cameraSelect = document.getElementById('cameraSelect');

  let currentMaskImg = null;
  let currentBgMedia = null;
  let isBgVideo = false;
  let maskScale = 1.0;
  let maskOffsetY = 0;
  let isPoseEnabled = true;

  // MediaRecorder & Audio Vars
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let audioContext = null;
  let analyser = null;
  let micStream = null;

  // Restabilire setări salvate
  window.addEventListener('load', async () => {
    loadSettings();
    await initCameras();
    initAudio();
  });

  // Enumerare Camere Web
  async function initCameras() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(d => d.kind === 'videoinput');
      cameraSelect.innerHTML = '';

      videoDevices.forEach((device, i) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `Cameră ${i + 1}`;
        cameraSelect.appendChild(option);
      });

      if (videoDevices.length > 0) {
        startCamera(videoDevices[0].deviceId);
      }
    } catch (err) {
      document.getElementById('status').innerText = "Eroare permisiune cameră!";
    }
  }

  cameraSelect.addEventListener('change', (e) => {
    startCamera(e.target.value);
  });

  let currentCamera = null;
  function startCamera(deviceId) {
    if (currentCamera) { currentCamera.stop(); }

    currentCamera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
        if (isPoseEnabled) await pose.send({ image: videoElement });
      },
      width: 1280, height: 720,
      deviceId: deviceId
    });
    currentCamera.start().then(() => {
      document.getElementById('status').innerText = "Cameră Activă";
    });
  }

  // Setări UI Event-uri
  document.getElementById('maskScale').addEventListener('input', (e) => {
    maskScale = parseFloat(e.target.value);
    document.getElementById('scaleVal').innerText = maskScale;
    localStorage.setItem('vt_maskScale', maskScale);
  });

  document.getElementById('maskOffsetY').addEventListener('input', (e) => {
    maskOffsetY = parseInt(e.target.value);
    localStorage.setItem('vt_maskOffsetY', maskOffsetY);
  });

  document.getElementById('enablePose').addEventListener('change', (e) => {
    isPoseEnabled = e.target.checked;
  });

  // Încarcă Masca (PNG) + Salvare în LocalStorage
  document.getElementById('maskUpload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => { currentMaskImg = img; };
        localStorage.setItem('vt_savedMask', event.target.result);
      };
      reader.readAsDataURL(file);
    }
  });

  // Încarcă Fundal (Imagine/Video)
  document.getElementById('bgUpload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const url = URL.createObjectURL(file);
      if (file.type.startsWith('video/')) {
        const video = document.createElement('video');
        video.src = url; video.autoplay = true; video.loop = true; video.muted = true;
        video.play();
        currentBgMedia = video;
        isBgVideo = true;
      } else {
        const img = new Image();
        img.src = url;
        img.onload = () => { currentBgMedia = img; isBgVideo = false; };
      }
    }
  });

  // Încărcare Măștile din memorie
  function loadSettings() {
    const savedScale = localStorage.getItem('vt_maskScale');
    const savedOffsetY = localStorage.getItem('vt_maskOffsetY');
    const savedMask = localStorage.getItem('vt_savedMask');

    if (savedScale) {
      maskScale = parseFloat(savedScale);
      document.getElementById('maskScale').value = maskScale;
      document.getElementById('scaleVal').innerText = maskScale;
    }
    if (savedOffsetY) {
      maskOffsetY = parseInt(savedOffsetY);
      document.getElementById('maskOffsetY').value = maskOffsetY;
    }
    if (savedMask) {
      const img = new Image();
      img.src = savedMask;
      img.onload = () => { currentMaskImg = img; };
    }
  }

  // MediaPipe FaceMesh & Pose
  const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
  faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
  
  const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
  pose.setOptions({ modelComplexity: 1, smoothLandmarks: true });

  let latestFaceResults = null;
  let latestPoseResults = null;

  faceMesh.onResults((results) => { latestFaceResults = results; renderScene(); });
  pose.onResults((results) => { latestPoseResults = results; });

  // Redare Cadru pe Canvas
  function renderScene() {
    canvasElement.width = videoElement.videoWidth || 1280;
    canvasElement.height = videoElement.videoHeight || 720;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    // 1. Redare Fundal (sau Camera Web implicită)
    if (currentBgMedia) {
      canvasCtx.drawImage(currentBgMedia, 0, 0, canvasElement.width, canvasElement.height);
    } else if (latestFaceResults && latestFaceResults.image) {
      canvasCtx.drawImage(latestFaceResults.image, 0, 0, canvasElement.width, canvasElement.height);
    }

    // 2. Redare Schelet Corp (Body Pose 3D)
    if (isPoseEnabled && latestPoseResults && latestPoseResults.poseLandmarks) {
      drawBodyPose(latestPoseResults.poseLandmarks);
    }

    // 3. Redare Mască Peste Față
    if (latestFaceResults && latestFaceResults.multiFaceLandmarks && latestFaceResults.multiFaceLandmarks.length > 0) {
      drawMask(latestFaceResults.multiFaceLandmarks[0]);
    }

    canvasCtx.restore();
  }

  function drawBodyPose(landmarks) {
    const connections = [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24]];
    canvasCtx.lineWidth = 4;
    canvasCtx.strokeStyle = '#00FF88';

    connections.forEach(([i, j]) => {
      const p1 = landmarks[i], p2 = landmarks[j];
      if (p1 && p2 && p1.visibility > 0.5 && p2.visibility > 0.5) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
        canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
        canvasCtx.stroke();
      }
    });
  }

  function drawMask(landmarks) {
    if (!currentMaskImg) return;

    const top = landmarks[10], bottom = landmarks[152], left = landmarks[234], right = landmarks[454];
    const cx = ((left.x + right.x) / 2) * canvasElement.width;
    const cy = (((top.y + bottom.y) / 2) * canvasElement.height) + maskOffsetY;

    const width = Math.hypot((right.x - left.x) * canvasElement.width, (right.y - left.y) * canvasElement.height) * 2.2 * maskScale;
    const height = width * (currentMaskImg.height / currentMaskImg.width);
    const angle = Math.atan2((right.y - left.y) * canvasElement.height, (right.x - left.x) * canvasElement.width);

    canvasCtx.save();
    canvasCtx.translate(cx, cy);
    canvasCtx.rotate(angle);
    canvasCtx.drawImage(currentMaskImg, -width / 2, -height / 2, width, height);
    canvasCtx.restore();
  }

  // VU Meter & Microfon
  async function initAudio() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      const source = audioContext.createMediaStreamSource(micStream);
      source.connect(analyser);
      analyser.fftSize = 64;
      
      updateVUMeter();
    } catch (e) {
      console.warn("Microfon nepermis sau indisponibil.");
    }
  }

  function updateVUMeter() {
    if (analyser) {
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
      const average = sum / dataArray.length;
      const volumePercent = Math.min(100, Math.max(0, (average / 128) * 100));
      document.getElementById('vuBar').style.width = volumePercent + '%';
    }
    requestAnimationFrame(updateVUMeter);
  }

  // Înregistrare Video (Record & Download)
  function toggleRecording() {
    if (!isRecording) {
      startRecording();
    } else {
      stopRecording();
    }
  }

  function startRecording() {
    recordedChunks = [];
    const canvasStream = canvasElement.captureStream(30);

    // Combinăm Canvas Video cu Microfon Audio
    let tracks = [...canvasStream.getVideoTracks()];
    if (micStream && micStream.getAudioTracks().length > 0) {
      tracks.push(micStream.getAudioTracks()[0]);
    }

    const combinedStream = new MediaStream(tracks);
    mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = downloadVideo;

    mediaRecorder.start();
    isRecording = true;

    const btn = document.getElementById('recordBtn');
    btn.classList.add('recording');
    document.getElementById('recordText').innerText = "Stop & Save";
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;

      const btn = document.getElementById('recordBtn');
      btn.classList.remove('recording');
      document.getElementById('recordText').innerText = "Record Video";
    }
  }

  function downloadVideo() {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = `VTuber_Record_${Date.now()}.webm`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }, 100);
  }

  // Fullscreen Functions
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  }

  function toggleUIPanel() {
    const panel = document.getElementById('ui-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  }
</script>
</body>
</html>
