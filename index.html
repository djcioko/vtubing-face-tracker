<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTuber Studio - AI Crop & Interactive Masking</title>
  <style>
    :root {
      --bg-color: #0c101d;
      --card-bg: #13192b;
      --accent-color: #0088ff;
      --text-color: #ffffff;
      --border-color: #1e2942;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    .header-title {
      text-align: center;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 12px;
      color: #38ef7d;
    }

    /* Zona de afișare video / mască */
    .viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #05070d;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--accent-color);
      user-select: none;
      touch-action: none;
      cursor: grab;
    }

    .viewport:active {
      cursor: grabbing;
    }

    /* Layer-ul cu corpul real / fundalul */
    .background-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Containerul măștii avatarului cu suport pentru drag & zoom */
    .avatar-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      z-index: 2;
      pointer-events: none;
    }

    .avatar-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Stiluri modul AI Crop active */
    .avatar-wrapper.ai-crop-on .avatar-image {
      object-fit: cover;
      min-width: 120%;
      min-height: 120%;
    }

    /* Panou Butoane de Control Superior */
    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      background: #1c2640;
      color: #fff;
      border: 1px solid #2a3a60;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn:hover {
      background: var(--accent-color);
    }

    .btn.active {
      background: #0088ff;
      border-color: #00aaff;
    }

    .btn-fullscreen {
      grid-column: span 2;
      background: #28a745;
      border-color: #34ce57;
    }

    .btn-fullscreen:hover {
      background: #218838;
    }

    /* Controale Glisante (Sliders) */
    .control-group {
      margin-top: 16px;
    }

    .control-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8a99ad;
      margin-bottom: 10px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .slider-row label {
      width: 40%;
      color: #c3d1e0;
    }

    .slider-row input[type="range"] {
      width: 58%;
      accent-color: var(--accent-color);
    }

    .info-overlay {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      color: #aaa;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <div class="header-title">VTuber Studio v1.5 - Interactive Calibration</div>

  <!-- Ecranul Principal Visual -->
  <div class="viewport" id="viewport">
    <div class="info-overlay">Trage cu mouse-ul pentru mutare | Rotiță pt. Zoom</div>
    
    <!-- Fundal / Cameră -->
    <img src="https://via.placeholder.com/600x600/111827/ffffff?text=Fundal+Scen%C4%83" class="background-layer" id="bgLayer" alt="Fundal">
    
    <!-- Masca Avatar cu suport de transformare -->
    <div class="avatar-wrapper ai-crop-on" id="avatarWrapper">
      <img src="https://via.placeholder.com/400x400/0088ff/ffffff?text=Avatar+PNG" class="avatar-image" id="avatarImg" alt="Avatar PNG">
    </div>
  </div>

  <!-- Comenzi Superioare -->
  <div class="button-grid">
    <button class="btn active" id="btnAiCrop" onclick="toggleAiCrop()">AI Crop & Fit: ON</button>
    <button class="btn" onclick="resetTransform()">Reset Poziție</button>
    <button class="btn btn-fullscreen" onclick="toggleFullScreen()">🖥️ Mod Ecran Complet (Full Screen)</button>
  </div>

  <!-- Controale de Calibrare -->
  <div class="control-group">
    <div class="control-title">⚙️ Calibrare Mască & Zoom</div>
    
    <div class="slider-row">
      <label for="scaleSlider">Scală / Zoom Avatar:</label>
      <input type="range" id="scaleSlider" min="0.5" max="3" step="0.05" value="1.2" oninput="updateFromSliders()">
    </div>

    <div class="slider-row">
      <label for="offsetXSlider">Poziție X (Orizontal):</label>
      <input type="range" id="offsetXSlider" min="-200" max="200" value="0" oninput="updateFromSliders()">
    </div>

    <div class="slider-row">
      <label for="offsetYSlider">Poziție Y (Vertical):</label>
      <input type="range" id="offsetYSlider" min="-200" max="200" value="0" oninput="updateFromSliders()">
    </div>
  </div>
</div>

<script>
  // Starea transformării
  let scale = 1.2;
  let posX = 0;
  let posY = 0;
  let isAiCropOn = true;

  const avatarWrapper = document.getElementById('avatarWrapper');
  const viewport = document.getElementById('viewport');
  const scaleSlider = document.getElementById('scaleSlider');
  const offsetXSlider = document.getElementById('offsetXSlider');
  const offsetYSlider = document.getElementById('offsetYSlider');
  const btnAiCrop = document.getElementById('btnAiCrop');

  // Actualizează proprietățile vizuale ale avatarului
  function applyTransform() {
    avatarWrapper.style.transform = `translate(-50%, -50%) translate(${posX}px, ${posY}px) scale(${scale})`;
    scaleSlider.value = scale;
    offsetXSlider.value = posX;
    offsetYSlider.value = posY;
  }

  function updateFromSliders() {
    scale = parseFloat(scaleSlider.value);
    posX = parseInt(offsetXSlider.value);
    posY = parseInt(offsetYSlider.value);
    applyTransform();
  }

  // Comutare AI Crop / Auto Fit
  function toggleAiCrop() {
    isAiCropOn = !isAiCropOn;
    if (isAiCropOn) {
      avatarWrapper.classList.add('ai-crop-on');
      btnAiCrop.classList.add('active');
      btnAiCrop.innerText = 'AI Crop & Fit: ON';
      scale = 1.2;
    } else {
      avatarWrapper.classList.remove('ai-crop-on');
      btnAiCrop.classList.remove('active');
      btnAiCrop.innerText = 'AI Crop & Fit: OFF';
      scale = 1.0;
    }
    applyTransform();
  }

  // Resetare poziție
  function resetTransform() {
    scale = isAiCropOn ? 1.2 : 1.0;
    posX = 0;
    posY = 0;
    applyTransform();
  }

  // Interacțiune prin Dragging (Mouse și Touch)
  let isDragging = false;
  let startX, startY;

  viewport.addEventListener('mousedown', (e) => {
    isDragging = true;
    startX = e.clientX - posX;
    startY = e.clientY - posY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    applyTransform();
  });

  window.addEventListener('mouseup', () => { isDragging = false; });

  // Zoom prin Rotița Mouse-ului
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 0.05 : -0.05;
    scale = Math.min(Math.max(0.5, scale + zoomFactor), 3.0);
    applyTransform();
  }, { passive: false });

  // Ecran Complet (Full Screen)
  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.getElementById('mainContainer').requestFullscreen().catch(err => {
        alert(`Eroare activare Full Screen: ${err.message}`);
      });
    } else {
      document.exitFullscreen();
    }
  }

  // Inițializare
  applyTransform();
</script>

</body>
</html>
