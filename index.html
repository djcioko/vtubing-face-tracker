<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTubing Face Tracker - DJ Cioko</title>

  <!-- Biblioteci MediaPipe CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: #090d16;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 { margin: 5px 0 12px 0; color: #38bdf8; font-size: 18px; }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1e293b;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .metrics-panel {
      width: 100%;
      max-width: 480px;
      margin-top: 12px;
      background: #111827;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #1f2937;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }

    progress {
      width: 50%;
      height: 12px;
      accent-color: #38bdf8;
    }

    #status {
      font-size: 12px;
      color: #eab308;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <h2>🎭 VTubing Face Tracker (478 Puncte)</h2>

  <div class="canvas-container">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="metrics-panel">
    <div class="metric">
      <span>Gură deschisă (jawOpen):</span>
      <progress id="jawProgress" value="0" max="1"></progress>
    </div>
    <div class="metric">
      <span>Clipire Stânga (eyeBlink):</span>
      <progress id="blinkProgress" value="0" max="1"></progress>
    </div>
    <div class="metric">
      <span>Iris Stâng (X, Y):</span>
      <strong id="irisCoords" style="color: #38bdf8;">0.00, 0.00</strong>
    </div>
    <div id="status">Se pornește camera... Permiteți accesul!</div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    const jawProgress = document.getElementById('jawProgress');
    const blinkProgress = document.getElementById('blinkProgress');
    const irisCoords = document.getElementById('irisCoords');
    const statusEl = document.getElementById('status');

    canvasElement.width = 640;
    canvasElement.height = 480;

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      statusEl.innerText = "Tracking Activ 🟢";
      statusEl.style.color = "#22c55e";

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#C0C0C040', lineWidth: 1});
        drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_IRIS, {color: '#00FFFF', lineWidth: 2});
        drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_IRIS, {color: '#FF00FF', lineWidth: 2});

        const lipTop = landmarks[13];
        const lipBottom = landmarks[14];
        const jawDist = Math.hypot(lipTop.x - lipBottom.x, lipTop.y - lipBottom.y);
        const jawOpen = Math.min(Math.max((jawDist - 0.015) * 12, 0), 1);
        jawProgress.value = jawOpen;

        const eyeTop = landmarks[159];
        const eyeBottom = landmarks[145];
        const eyeDist = Math.hypot(eyeTop.x - eyeBottom.x, eyeTop.y - eyeBottom.y);
        blinkProgress.value = eyeDist < 0.018 ? 1 : 0;

        const leftIris = landmarks[468];
        irisCoords.innerText = `${leftIris.x.toFixed(2)},${leftIris.y.toFixed(2)}`;
      }
      canvasCtx.restore();
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 640,
      height: 480
    });

    camera.start().catch(() => {
      statusEl.innerText = "Eroare acces cameră!";
      statusEl.style.color = "#ef4444";
    });
  </script>
</body>
</html>
