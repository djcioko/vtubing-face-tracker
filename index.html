<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTubing Custom Mask Overlay - DJ Cioko</title>

  <!-- MediaPipe CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: #090d16;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 { margin: 5px 0 12px 0; color: #38bdf8; font-size: 18px; }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1e293b;
      background: #000;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .controls-panel {
      width: 100%;
      max-width: 480px;
      margin-top: 12px;
      background: #111827;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #1f2937;
    }

    .upload-btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: white;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 12px;
    }

    input[type="file"] { display: none; }

    .gallery {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .gallery-item {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 8px;
      border: 2px solid #334155;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
    }

    .gallery-item.active {
      border-color: #38bdf8;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .delete-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #status {
      font-size: 12px;
      color: #22c55e;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h2>🎭 VTubing Custom Overlay App</h2>

  <div class="canvas-container">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="controls-panel">
    <label class="upload-btn">
      ➕ Încarcă Imagine (PNG / JPG)
      <input type="file" id="imageLoader" accept="image/*">
    </label>

    <div style="font-size: 12px; margin-bottom: 6px; color: #94a3b8;">Măștile tale salvate:</div>
    <div class="gallery" id="gallery"></div>

    <div id="status">Se pornește camera...</div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const galleryEl = document.getElementById('gallery');
    const statusEl = document.getElementById('status');

    let activeImage = null;
    let savedImages = JSON.parse(localStorage.getItem('vtuber_masks') || '[]');

    canvasElement.width = 640;
    canvasElement.height = 480;

    function saveAndRenderGallery() {
      localStorage.setItem('vtuber_masks', JSON.stringify(savedImages));
      galleryEl.innerHTML = '';
      
      savedImages.forEach((src, index) => {
        const item = document.createElement('div');
        item.className = 'gallery-item' + (activeImage && activeImage.src === src ? ' active' : '');
        
        const img = document.createElement('img');
        img.src = src;
        img.onclick = () => {
          activeImage = new Image();
          activeImage.src = src;
          saveAndRenderGallery();
        };

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.innerText = '✕';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          if (activeImage && activeImage.src === src) activeImage = null;
          savedImages.splice(index, 1);
          saveAndRenderGallery();
        };

        item.appendChild(img);
        item.appendChild(delBtn);
        galleryEl.appendChild(item);
      });
    }

    document.getElementById('imageLoader').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const base64Img = event.target.result;
          savedImages.push(base64Img);
          activeImage = new Image();
          activeImage.src = base64Img;
          saveAndRenderGallery();
        };
        reader.readAsDataURL(file);
      }
    });

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      statusEl.innerText = "Tracking Activ 🟢";
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // Mască vizuală discretă
        drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#C0C0C020', lineWidth: 1});

        if (activeImage && activeImage.complete) {
          const leftEye = landmarks[33];
          const rightEye = landmarks[263];
          const nose = landmarks[1];

          const dx = (rightEye.x - leftEye.x) * canvasElement.width;
          const dy = (rightEye.y - leftEye.y) * canvasElement.height;
          const angle = Math.atan2(dy, dx);

          const eyeDistance = Math.hypot(dx, dy);
          const maskWidth = eyeDistance * 3.2;
          const maskHeight = maskWidth * (activeImage.height / activeImage.width);

          const centerX = nose.x * canvasElement.width;
          const centerY = nose.y * canvasElement.height;

          canvasCtx.save();
          canvasCtx.translate(centerX, centerY);
          canvasCtx.rotate(angle);
          canvasCtx.drawImage(activeImage, -maskWidth / 2, -maskHeight / 2, maskWidth, maskHeight);
          canvasCtx.restore();
        }
      }
      canvasCtx.restore();
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 640,
      height: 480
    });

    camera.start();
    saveAndRenderGallery();
  </script>
</body>
</html>
