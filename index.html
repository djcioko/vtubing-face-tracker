<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VTuber Studio v3.0 - Touch, Gallery & MP4 Recorder</title>
  
  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; }
    
    #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #111; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
    video { display: none; }
    
    /* UI Panel Left */
    #ui-panel {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(15, 15, 25, 0.88); backdrop-filter: blur(8px);
      padding: 15px; border-radius: 10px; width: 320px; max-height: 88vh;
      overflow-y: auto; font-size: 13px; border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }
    .group { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    label { display: block; margin-top: 6px; font-weight: 600; color: #ccc; }
    input[type="range"], input[type="file"], select, button {
      width: 100%; margin-top: 5px; padding: 6px; background: #222; color: #fff;
      border: 1px solid #444; border-radius: 6px; outline: none;
    }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .toggle-row input { width: auto; }

    /* Galeriile cu miniaturi */
    .gallery-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px;
    }
    .gallery-item {
      position: relative; width: 100%; aspect-ratio: 1; border-radius: 6px; overflow: hidden;
      border: 2px solid #444; cursor: pointer; background: #000;
    }
    .gallery-item.active { border-color: #2ecc71; }
    .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }
    .btn-delete {
      position: absolute; top: 2px; right: 2px; background: rgba(231, 76, 60, 0.9);
      color: white; border: none; font-size: 10px; width: 16px; height: 16px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-weight: bold; line-height: 1;
    }

    /* Controls Overlay in Fullscreen */
    #fullscreen-overlay {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 99;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
      padding: 10px 20px; border-radius: 30px; display: flex; align-items: center; gap: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    .btn-record {
      background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 20px;
      font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .btn-record.recording { background: #27ae60; animation: pulse 1.5s infinite; }

    .vu-meter-container { width: 100px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
    .vu-meter-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #2ecc71 60%, #f1c40f 85%, #e74c3c 100%); }

    .btn-icon { background: #333; border: none; color: white; padding: 8px 12px; border-radius: 50%; cursor: pointer; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
      100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
    }
  </style>
</head>
<body>

<div id="container">
  <video id="webcam" playsinline></video>
  <canvas id="output_canvas"></canvas>

  <div id="ui-panel">
    <h3>🎭 VTuber Studio v3.0</h3>
    
    <div class="group">
      <label>Dispozitiv Cameră Web:</label>
      <select id="cameraSelect"><option>Căutare camere...</option></select>
      <div id="status" style="color: #2ecc71; margin-top: 5px; font-weight: bold;">Se inițializează...</div>
    </div>

    <div class="group">
      <div class="toggle-row">
        <span>Urmărire Corp 3D (Pose)</span>
        <input type="checkbox" id="enablePose" checked>
      </div>
      <div class="toggle-row">
        <span>Afișează Video Cameră</span>
        <input type="checkbox" id="showWebcam" checked>
      </div>
    </div>

    <div class="group">
      <label>Scalare Mască: <span id="scaleVal">1.0</span>x</label>
      <input type="range" id="maskScale" min="0.1" max="4.0" step="0.05" value="1.0">
      
      <label>Poziție Offset (X / Y)</label>
      <div style="display:flex; gap: 5px;">
        <input type="range" id="maskOffsetX" min="-200" max="200" step="1" value="0">
        <input type="range" id="maskOffsetY" min="-200" max="200" step="1" value="0">
      </div>
    </div>

    <!-- Galerie Măști PNG -->
    <div class="group">
      <label>Galerie Măști (PNG Multiplu):</label>
      <input type="file" id="maskUpload" accept="image/png" multiple>
      <div id="maskGallery" class="gallery-grid"></div>
    </div>

    <!-- Galerie Fundaluri -->
    <div class="group">
      <label>Galerie Fundaluri (Foto/Video Multiplu):</label>
      <input type="file" id="bgUpload" accept="image/*, video/*" multiple>
      <div id="bgGallery" class="gallery-grid"></div>
    </div>

    <button onclick="toggleFullscreen()">🖥️ Fullscreen Mode</button>
  </div>

  <div id="fullscreen-overlay">
    <button id="recordBtn" class="btn-record" onclick="toggleRecording()">
      <span style="height: 10px; width: 10px; background: white; border-radius: 50%;"></span>
      <span id="recordText">Record MP4</span>
    </button>

    <div style="display: flex; align-items: center; gap: 8px;">
      <span>🎙️</span>
      <div class="vu-meter-container">
        <div id="vuBar" class="vu-meter-bar"></div>
      </div>
    </div>

    <button class="btn-icon" title="Comută Panoul" onclick="toggleUIPanel()">⚙️</button>
  </div>
</div>

<script>
  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const cameraSelect = document.getElementById('cameraSelect');

  let activeMaskImg = null;
  let activeBgMedia = null;
  let maskScale = 1.0;
  let maskOffsetX = 0;
  let maskOffsetY = 0;
  let isPoseEnabled = true;
  let showWebcam = true;

  let maskList = [];
  let bgList = [];

  // Gesture/Touch & Mouse dragging
  let isDragging = false;
  let startX = 0, startY = 0;
  let initialPinchDist = null;

  window.addEventListener('load', async () => {
    loadGalleries();
    await initCameras();
    initAudio();
    initTouchControls();
  });

  // Touch & Mouse Dragging / Scaling Control
  function initTouchControls() {
    canvasElement.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - maskOffsetX;
      startY = e.clientY - maskOffsetY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      maskOffsetX = e.clientX - startX;
      maskOffsetY = e.clientY - startY;
      document.getElementById('maskOffsetX').value = maskOffsetX;
      document.getElementById('maskOffsetY').value = maskOffsetY;
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    canvasElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      maskScale += e.deltaY * -0.001;
      maskScale = Math.min(Math.max(0.1, maskScale), 4.0);
      document.getElementById('maskScale').value = maskScale;
      document.getElementById('scaleVal').innerText = maskScale.toFixed(2);
    }, { passive: false });

    // Touch Support
    canvasElement.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - maskOffsetX;
        startY = e.touches[0].clientY - maskOffsetY;
      } else if (e.touches.length === 2) {
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    });

    canvasElement.addEventListener('touchmove', (e) => {
      if (isDragging && e.touches.length === 1) {
        maskOffsetX = e.touches[0].clientX - startX;
        maskOffsetY = e.touches[0].clientY - startY;
      } else if (e.touches.length === 2 && initialPinchDist) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = dist / initialPinchDist;
        maskScale = Math.min(Math.max(0.1, maskScale * factor), 4.0);
        initialPinchDist = dist;
        document.getElementById('maskScale').value = maskScale;
        document.getElementById('scaleVal').innerText = maskScale.toFixed(2);
      }
    });

    canvasElement.addEventListener('touchend', () => {
      isDragging = false;
      initialPinchDist = null;
    });
  }

  // Camera Management
  async function initCameras() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(d => d.kind === 'videoinput');
      cameraSelect.innerHTML = '';

      videoDevices.forEach((device, i) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `Cameră ${i + 1}`;
        cameraSelect.appendChild(option);
      });

      if (videoDevices.length > 0) startCamera(videoDevices[0].deviceId);
    } catch (err) {
      document.getElementById('status').innerText = "Eroare acces cameră!";
    }
  }

  let currentCamera = null;
  function startCamera(deviceId) {
    if (currentCamera) currentCamera.stop();
    currentCamera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
        if (isPoseEnabled) await pose.send({ image: videoElement });
      },
      width: 1280, height: 720, deviceId: deviceId
    });
    currentCamera.start().then(() => { document.getElementById('status').innerText = "Cameră Activă"; });
  }

  // UI Listeners
  document.getElementById('maskScale').addEventListener('input', (e) => {
    maskScale = parseFloat(e.target.value);
    document.getElementById('scaleVal').innerText = maskScale.toFixed(2);
  });
  document.getElementById('maskOffsetX').addEventListener('input', (e) => { maskOffsetX = parseInt(e.target.value); });
  document.getElementById('maskOffsetY').addEventListener('input', (e) => { maskOffsetY = parseInt(e.target.value); });
  document.getElementById('enablePose').addEventListener('change', (e) => { isPoseEnabled = e.target.checked; });
  document.getElementById('showWebcam').addEventListener('change', (e) => { showWebcam = e.target.checked; });

  // Încărcare Multiplă Mășți în Galerie
  document.getElementById('maskUpload').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (event) => {
        maskList.push(event.target.result);
        saveGalleries();
        renderMaskGallery();
      };
      reader.readAsDataURL(file);
    });
  });

  // Încărcare Multiplă Fundaluri în Galerie
  document.getElementById('bgUpload').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (event) => {
        bgList.push({ src: event.target.result, type: file.type.startsWith('video/') ? 'video' : 'image' });
        saveGalleries();
        renderBgGallery();
      };
      reader.readAsDataURL(file);
    });
  });

  function renderMaskGallery() {
    const container = document.getElementById('maskGallery');
    container.innerHTML = '';
    maskList.forEach((src, idx) => {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      div.innerHTML = `<img src="${src}"><button class="btn-delete" onclick="deleteMask(${idx}, event)">X</button>`;
      div.onclick = () => {
        document.querySelectorAll('#maskGallery .gallery-item').forEach(el => el.classList.remove('active'));
        div.classList.add('active');
        const img = new Image();
        img.src = src;
        img.onload = () => { activeMaskImg = img; };
      };
      container.appendChild(div);
    });
  }

  function renderBgGallery() {
    const container = document.getElementById('bgGallery');
    container.innerHTML = '';
    bgList.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      div.innerHTML = item.type === 'video' 
        ? `<video src="${item.src}" muted loop></video><button class="btn-delete" onclick="deleteBg(${idx}, event)">X</button>`
        : `<img src="${item.src}"><button class="btn-delete" onclick="deleteBg(${idx}, event)">X</button>`;
      
      div.onclick = () => {
        document.querySelectorAll('#bgGallery .gallery-item').forEach(el => el.classList.remove('active'));
        div.classList.add('active');
        if (item.type === 'video') {
          const v = document.createElement('video');
          v.src = item.src; v.autoplay = true; v.loop = true; v.muted = true; v.play();
          activeBgMedia = v;
        } else {
          const img = new Image();
          img.src = item.src;
          img.onload = () => { activeBgMedia = img; };
        }
      };
      container.appendChild(div);
    });
  }

  function deleteMask(idx, e) {
    e.stopPropagation();
    maskList.splice(idx, 1);
    if (maskList.length === 0) activeMaskImg = null;
    saveGalleries();
    renderMaskGallery();
  }

  function deleteBg(idx, e) {
    e.stopPropagation();
    bgList.splice(idx, 1);
    if (bgList.length === 0) activeBgMedia = null;
    saveGalleries();
    renderBgGallery();
  }

  function saveGalleries() {
    try {
      localStorage.setItem('vt_masks', JSON.stringify(maskList));
      localStorage.setItem('vt_bgs', JSON.stringify(bgList));
    } catch (e) { console.warn("Punct atins limita LocalStorage."); }
  }

  function loadGalleries() {
    const savedMasks = localStorage.getItem('vt_masks');
    const savedBgs = localStorage.getItem('vt_bgs');
    if (savedMasks) { maskList = JSON.parse(savedMasks); renderMaskGallery(); }
    if (savedBgs) { bgList = JSON.parse(savedBgs); renderBgGallery(); }
  }

  // MediaPipe Engines
  const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
  faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
  
  const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
  pose.setOptions({ modelComplexity: 1, smoothLandmarks: true });

  let latestFaceResults = null, latestPoseResults = null;
  faceMesh.onResults((results) => { latestFaceResults = results; renderScene(); });
  pose.onResults((results) => { latestPoseResults = results; });

  // Main Canvas Render Loop
  function renderScene() {
    canvasElement.width = videoElement.videoWidth || 1280;
    canvasElement.height = videoElement.videoHeight || 720;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    // 1. Draw Background
    if (activeBgMedia) {
      canvasCtx.drawImage(activeBgMedia, 0, 0, canvasElement.width, canvasElement.height);
    }

    // 2. Draw Webcam Feed (if enabled)
    if (showWebcam && latestFaceResults && latestFaceResults.image) {
      canvasCtx.drawImage(latestFaceResults.image, 0, 0, canvasElement.width, canvasElement.height);
    }

    // 3. Draw Body Pose Skeleton
    if (isPoseEnabled && latestPoseResults && latestPoseResults.poseLandmarks) {
      drawBodyPose(latestPoseResults.poseLandmarks);
    }

    // 4. Draw Mask
    if (latestFaceResults && latestFaceResults.multiFaceLandmarks && latestFaceResults.multiFaceLandmarks.length > 0) {
      drawMask(latestFaceResults.multiFaceLandmarks[0]);
    }

    canvasCtx.restore();
  }

  function drawBodyPose(landmarks) {
    const connections = [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24]];
    canvasCtx.lineWidth = 4;
    canvasCtx.strokeStyle = '#00FF88';

    connections.forEach(([i, j]) => {
      const p1 = landmarks[i], p2 = landmarks[j];
      if (p1 && p2 && p1.visibility > 0.5 && p2.visibility > 0.5) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
        canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
        canvasCtx.stroke();
      }
    });
  }

  function drawMask(landmarks) {
    if (!activeMaskImg) return;

    const top = landmarks[10], bottom = landmarks[152], left = landmarks[234], right = landmarks[454];
    const cx = (((left.x + right.x) / 2) * canvasElement.width) + maskOffsetX;
    const cy = (((top.y + bottom.y) / 2) * canvasElement.height) + maskOffsetY;

    const width = Math.hypot((right.x - left.x) * canvasElement.width, (right.y - left.y) * canvasElement.height) * 2.2 * maskScale;
    const height = width * (activeMaskImg.height / activeMaskImg.width);
    const angle = Math.atan2((right.y - left.y) * canvasElement.height, (right.x - left.x) * canvasElement.width);

    canvasCtx.save();
    canvasCtx.translate(cx, cy);
    canvasCtx.rotate(angle);
    canvasCtx.drawImage(activeMaskImg, -width / 2, -height / 2, width, height);
    canvasCtx.restore();
  }

  // Audio VU Meter
  let micStream = null, analyser = null;
  async function initAudio() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      const source = audioCtx.createMediaStreamSource(micStream);
      source.connect(analyser);
      analyser.fftSize = 64;
      updateVUMeter();
    } catch (e) { console.warn("Microfon indisponibil"); }
  }

  function updateVUMeter() {
    if (analyser) {
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      const volume = Math.min(100, Math.max(0, ((sum / dataArray.length) / 128) * 100));
      document.getElementById('vuBar').style.width = volume + '%';
    }
    requestAnimationFrame(updateVUMeter);
  }

  // Recording Engine (MP4 Support)
  let mediaRecorder = null, recordedChunks = [], isRecording = false;

  function toggleRecording() {
    if (!isRecording) startRecording();
    else stopRecording();
  }

  function startRecording() {
    recordedChunks = [];
    const canvasStream = canvasElement.captureStream(30);
    let tracks = [...canvasStream.getVideoTracks()];
    if (micStream && micStream.getAudioTracks().length > 0) {
      tracks.push(micStream.getAudioTracks()[0]);
    }

    const combinedStream = new MediaStream(tracks);

    // MP4 MimeType check with webm fallback
    let mimeType = 'video/mp4';
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = 'video/webm;codecs=h264';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = 'video/webm';
      }
    }

    mediaRecorder = new MediaRecorder(combinedStream, { mimeType: mimeType });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => downloadVideo(mimeType);

    mediaRecorder.start();
    isRecording = true;
    const btn = document.getElementById('recordBtn');
    btn.classList.add('recording');
    document.getElementById('recordText').innerText = "Stop & Save";
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      const btn = document.getElementById('recordBtn');
      btn.classList.remove('recording');
      document.getElementById('recordText').innerText = "Record MP4";
    }
  }

  function downloadVideo(mimeType) {
    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(recordedChunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = `VTuber_Record_${Date.now()}.${ext}`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else if (document.exitFullscreen) document.exitFullscreen();
  }

  function toggleUIPanel() {
    const panel = document.getElementById('ui-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  }
</script>
</body>
</html>
